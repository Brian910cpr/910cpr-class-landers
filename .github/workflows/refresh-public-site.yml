name: Refresh public site from Enrollware iCal

on:
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Force a full rebuild from the live Enrollware feed even when the feed hash is unchanged"
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - '.github/workflows/refresh-public-site.yml'
      - 'scripts/audit_sitewide_links.py'
      - 'scripts/validate_sitewide_links_strict.py'
      - 'tests/test_validate_sitewide_links_strict.py'
      - 'docs/contact.html'

permissions:
  contents: write

concurrency:
  group: schedule-publish-main
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh public static output
    # The tracked public tree intentionally preserves a small set of case-only
    # legacy URL aliases. A Linux checkout is required to represent both blobs.
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt openpyxl beautifulsoup4 tqdm pandas

      - name: Test strict link audit fail-closed guard
        shell: pwsh
        run: python -m unittest discover -s tests -p "test_validate_sitewide_links_strict.py"

      - name: Compute Enrollware iCal hash
        id: ical
        shell: pwsh
        run: |
          $script = @'
          import hashlib
          import os
          import urllib.request
          from pathlib import Path

          from scripts.build_sessions_current import DEFAULT_ENROLLWARE_ICAL_URL, ENROLLWARE_ICAL_USER_AGENT

          hash_path = Path("data/state_public/enrollware_ical_hash.txt")
          previous_hash = hash_path.read_text(encoding="utf-8").strip() if hash_path.exists() else ""
          url = os.environ.get("LANDER_ENROLLWARE_ICAL_URL") or DEFAULT_ENROLLWARE_ICAL_URL
          request = urllib.request.Request(url, headers={"User-Agent": ENROLLWARE_ICAL_USER_AGENT})
          with urllib.request.urlopen(request, timeout=60) as response:
              body = response.read()
          text = body.decode("utf-8", errors="replace")
          stable_lines = []
          for line in text.replace("\r\n", "\n").replace("\r", "\n").split("\n"):
              # Enrollware updates DTSTAMP on each feed response; it is not a class schedule change.
              if line.startswith("DTSTAMP:"):
                  continue
              stable_lines.append(line)
          stable_body = "\n".join(stable_lines).encode("utf-8")
          current_hash = hashlib.sha256(stable_body).hexdigest()
          changed = current_hash != previous_hash

          output_path = Path(os.environ["GITHUB_OUTPUT"])
          with output_path.open("a", encoding="utf-8") as out:
              out.write(f"current_hash={current_hash}\n")
              out.write(f"previous_hash={previous_hash}\n")
              out.write(f"changed={'true' if changed else 'false'}\n")
              out.write(f"bytes={len(body)}\n")

          print(f"Fetched Enrollware iCal bytes: {len(body)}")
          print(f"Previous iCal hash: {previous_hash or 'none'}")
          print(f"Current iCal hash: {current_hash}")
          print(f"iCal changed: {changed}")
          '@
          $script | python -

      - name: Report forced rebuild
        if: (github.event_name == 'workflow_dispatch' && inputs.force_rebuild == true) || github.event_name == 'push'
        shell: pwsh
        run: |
          Write-Host "Validated self-test/forced rebuild requested. Rebuilding from the live Enrollware feed even if its stable hash is unchanged."

      - name: Skip unchanged iCal feed
        if: steps.ical.outputs.changed == 'false' && github.event_name != 'push' && !(github.event_name == 'workflow_dispatch' && inputs.force_rebuild == true)
        shell: pwsh
        run: |
          Write-Host "Enrollware iCal hash unchanged. Skipping public build and commit."

      - name: Run full validated public build
        if: steps.ical.outputs.changed == 'true' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force_rebuild == true)
        shell: bash
        env:
          LANDER_SKIP_REPOSITORY_TESTS: "1"
        run: python -m scripts.run_validated_public_build

      - name: Reconcile admin occupancy from current canonical sources
        if: steps.ical.outputs.changed == 'true' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force_rebuild == true)
        shell: pwsh
        env:
          HOT_SYNC_ADMIN_KEY: ${{ secrets.HOT_SYNC_ADMIN_KEY }}
        run: |
          python -m scripts.fetch_hot_sync_snapshot
          python -m scripts.publish_admin_schedule

      - name: Run strict link audit
        if: steps.ical.outputs.changed == 'true' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force_rebuild == true)
        shell: pwsh
        run: python -m scripts.validate_sitewide_links_strict

      - name: Upload link audit artifacts
        if: always() && (steps.ical.outputs.changed == 'true' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force_rebuild == true))
        uses: actions/upload-artifact@v4
        with:
          name: sitewide-link-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            debug/sitewide_link_button_audit.csv
            debug/sitewide_link_button_audit.md
          if-no-files-found: warn
          retention-days: 14

      - name: Validate refreshed public inventory
        if: success() && (steps.ical.outputs.changed == 'true' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force_rebuild == true))
        shell: pwsh
        run: python -m scripts.validate_public_refresh_output

      - name: Update stored iCal hash
        if: success() && (steps.ical.outputs.changed == 'true' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force_rebuild == true))
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force data/state_public | Out-Null
          Set-Content -Path data/state_public/enrollware_ical_hash.txt -Value "${{ steps.ical.outputs.current_hash }}" -NoNewline -Encoding utf8

      - name: Commit approved public output
        if: success() && (steps.ical.outputs.changed == 'true' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force_rebuild == true))
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          $baseCommit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $baseCommit) { throw "Could not capture checked-out base commit" }

          git add -- docs data/state_public/enrollware_ical_hash.txt

          $staged = @(git diff --cached --name-only)
          if ($staged.Count -eq 0) {
            Write-Host "No approved public output or iCal hash changes to commit."
            exit 0
          }

          $blockedPattern = '^(data/audit|data/runtime|data/state/|debug/|scripts/__pycache__/|tests/__pycache__/|data/private/|data/raw/|private/raw/)'
          $blocked = @($staged | Select-String -Pattern $blockedPattern)
          if ($blocked.Count -gt 0) {
            Write-Error "Blocked files were staged:`n$($blocked -join "`n")"
            exit 1
          }

          Write-Host "Staged files:"
          $staged | ForEach-Object { Write-Host " - $_" }

          # Publish only if main is still the exact source tree that was built.
          # This avoids resetting/cherry-picking inside the Windows worktree, where
          # tracked case-colliding aliases can appear dirty after an otherwise clean
          # reset. If main advanced during the build, fail closed and let the next
          # scheduled run rebuild from the new source tree.
          git commit -m "Refresh public schedule from Enrollware iCal"
          if ($LASTEXITCODE -ne 0) { throw "git commit failed with exit code $LASTEXITCODE" }
          $publishCommit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $publishCommit) { throw "Could not capture publication commit" }

          git fetch origin main
          if ($LASTEXITCODE -ne 0) { throw "git fetch failed with exit code $LASTEXITCODE" }
          $remoteMain = (git rev-parse origin/main).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $remoteMain) { throw "Could not resolve origin/main after fetch" }

          if ($remoteMain -ne $baseCommit) {
            Write-Error "origin/main advanced during this build ($baseCommit -> $remoteMain). Refusing to replay generated output onto a different source tree; the next scheduled run will rebuild from current main."
            exit 1
          }

          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw "git push failed with exit code $LASTEXITCODE" }
