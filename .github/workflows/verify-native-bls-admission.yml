name: Verify native BLS admission
on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'tests/helpers/**'
      - 'tests/native-bls-admission*'
      - '.github/workflows/verify-native-bls-admission.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'tests/helpers/**'
      - 'tests/native-bls-admission*'
      - '.github/workflows/verify-native-bls-admission.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  admission:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: skills_claim_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --ignore-scripts @electric-sql/pglite@0.5.15
      - run: node --test tests/native-bls-admission.test.mjs
      - name: Verify independent BLS and full chains on PostgreSQL17
        env:
          NATIVE_TEST_POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          createdb -h 127.0.0.1 -U postgres skills_claim_test_224642
          createdb -h 127.0.0.1 -U postgres skills_claim_test_224643
          node tests/native-bls-admission-concurrency.mjs
          node tests/native-bls-admission-concurrency.mjs --full
