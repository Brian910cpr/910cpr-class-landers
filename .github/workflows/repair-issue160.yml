name: Repair Issue 160 build_landers

on:
  push:
    branches:
      - fix/issue-160-build-landers

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt openpyxl beautifulsoup4 tqdm pandas

      - name: Restore clean generator and reapply registration routing
        shell: bash
        run: |
          git show 204236cadd45b9eb80d3483ee1174da061fa78eb:scripts/build_landers.py > scripts/build_landers.py
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/build_landers.py')
          text = path.read_text(encoding='utf-8')

          old = 'from pathlib import Path\nfrom zoneinfo import ZoneInfo\n'
          new = 'from pathlib import Path\nfrom urllib.parse import quote\nfrom zoneinfo import ZoneInfo\n'
          assert text.count(old) == 1, 'unexpected pathlib import shape'
          text = text.replace(old, new, 1)

          marker = '\n\ndef verified_enrollware_url(url: str) -> bool:\n'
          assert text.count(marker) == 1, 'unexpected verified_enrollware_url shape'
          helper = '''\n\ndef public_registration_url(session: dict) -> str:\n    \"\"\"Route real public classes through LanderWare before Enrollware checkout.\"\"\"\n    sid = str(session.get(\"session_id\") or \"\").strip()\n    return f\"/register/?session={quote(sid)}\" if sid.isdigit() else enrollware_url_for_session(session)\n'''
          text = text.replace(marker, helper + marker, 1)

          old = '''        successor_url = replacement_session_url(session)\n        presentation = lifecycle_presentation(\n            lander_status, course_label, city, type_page_url, register, successor_url, dt\n        )'''
          new = '''        successor_url = replacement_session_url(session)\n        student_register_url = public_registration_url(session)\n        presentation = lifecycle_presentation(\n            lander_status, course_label, city, type_page_url, student_register_url, successor_url, dt\n        )'''
          assert text.count(old) == 1, 'unexpected lifecycle_presentation call shape'
          text = text.replace(old, new, 1)

          old = '            register_js=js_escape(register if not retained_course_lander else \"\"),'
          new = '            register_js=js_escape(student_register_url if not retained_course_lander else \"\"),'
          assert text.count(old) == 1, 'unexpected register_js shape'
          text = text.replace(old, new, 1)

          assert 'Warning: truncated output (original token count:' not in text
          assert 'tokens truncated' not in text
          assert text.count('def public_registration_url(') == 1
          path.write_text(text, encoding='utf-8')
          PY

      - name: Add source-integrity regression guard
        shell: bash
        run: |
          cat > scripts/check_source_integrity.py <<'PY'
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          THIS = Path(__file__).resolve()
          SCAN_ROOTS = [ROOT / '.github', ROOT / 'scripts', ROOT / 'supabase', ROOT / 'tests']
          EXTENSIONS = {'.py', '.js', '.ts', '.tsx', '.json', '.yml', '.yaml', '.md', '.html', '.css', '.sql', '.bat', '.ps1', '.sh'}
          MARKERS = (
              'Warning: truncated output (original token count:',
              'tokens truncated',
          )

          failures = []
          for scan_root in SCAN_ROOTS:
              if not scan_root.exists():
                  continue
              for path in scan_root.rglob('*'):
                  if not path.is_file() or path.resolve() == THIS:
                      continue
                  if path.suffix.lower() not in EXTENSIONS:
                      continue
                  if any(part in {'.git', 'node_modules', '__pycache__'} for part in path.parts):
                      continue
                  try:
                      text = path.read_text(encoding='utf-8')
                  except UnicodeDecodeError:
                      continue
                  for marker in MARKERS:
                      if marker in text:
                          failures.append(f'{path.relative_to(ROOT)}: {marker}')

          if failures:
              print('Source-integrity failure: tool truncation marker(s) detected:')
              for failure in failures:
                  print(f'- {failure}')
              raise SystemExit(1)

          print('Source integrity OK: no tool-truncation markers detected.')
          PY

          cat > .github/workflows/source-integrity.yml <<'YML'
          name: Source integrity

          on:
            push:
            pull_request:

          permissions:
            contents: read

          jobs:
            truncation-guard:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-python@v5
                  with:
                    python-version: '3.12'
                - name: Reject tool-truncated source files
                  run: python scripts/check_source_integrity.py
          YML

      - name: Remove temporary repair workflow before validation
        shell: bash
        run: git rm .github/workflows/repair-issue160.yml

      - name: Validate repaired backend
        shell: bash
        run: |
          python -m py_compile scripts/build_landers.py
          python scripts/check_source_integrity.py
          python -m unittest tests.test_public_registration
          python -m scripts.build_landers --anchors-only
          git diff --check -- scripts/build_landers.py scripts/check_source_integrity.py .github/workflows/source-integrity.yml

      - name: Commit validated repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/build_landers.py scripts/check_source_integrity.py .github/workflows/source-integrity.yml
          git commit -m 'Repair corrupted build_landers generator (#160)'
          git push origin HEAD:fix/issue-160-build-landers
