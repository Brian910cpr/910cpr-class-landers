name: Verify public booking inventory
on:
  schedule:
    - cron: '*/5 * * * *'
  # Observe source refreshes promptly, then re-check after Pages finishes deploying.
  # Refresh commits may be checked before the CDN has the new lease: the second
  # observation distinguishes a transient publish race from persistent expiry.
  # Keep the early refresh alarm, cron heartbeat and all fail-closed safety gates.
  workflow_run:
    workflows: ['Refresh admin availability', 'pages build and deployment']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-booking-observation
  cancel-in-progress: false
jobs:
  observe:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: scripts/audit_family_publication_coverage.py
      - name: Check all public families and BLS/Heartsaver continuity
        run: python scripts/audit_family_publication_coverage.py --live --continuity --output public-booking-observation.json
      - name: Preserve timestamped public evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-booking-observation-${{ github.run_id }}
          path: public-booking-observation.json
          if-no-files-found: warn
          retention-days: 7
