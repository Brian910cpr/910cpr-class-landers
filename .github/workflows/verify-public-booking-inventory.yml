name: Verify public booking inventory
on:
  schedule:
    - cron: '*/5 * * * *'
  # Successful refresh completion starts an observer that waits for the exact
  # Pages deployment before fetching the public host; this prevents an early
  # pre-CDN snapshot from being mistaken for a post-deploy verification.
  # Cron and manual probes continue without waiting; every safety gate stays red.
  workflow_run:
    workflows: ['Refresh admin availability', 'pages build and deployment']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: public-booking-observation
  cancel-in-progress: false
jobs:
  observe:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/audit_family_publication_coverage.py
            scripts/wait_for_pages_publication.py
      - name: Wait for matching successful Pages deployment after refresh
        if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Refresh admin availability' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/wait_for_pages_publication.py
      - name: Check all public families and BLS/Heartsaver continuity
        run: python scripts/audit_family_publication_coverage.py --live --continuity --output public-booking-observation.json
      - name: Preserve timestamped public evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-booking-observation-${{ github.run_id }}
          path: public-booking-observation.json
          if-no-files-found: warn
          retention-days: 7
