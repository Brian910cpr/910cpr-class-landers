name: Cloudflare Pages preflight

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test preflight policy
        run: python -m unittest tests.test_cloudflare_pages_preflight
      - name: Validate deployable docs tree
        run: python -m scripts.cloudflare_pages_preflight --directory docs
