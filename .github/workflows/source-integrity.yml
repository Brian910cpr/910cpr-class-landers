name: Source integrity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  truncation-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject tool-truncated source files
        run: python scripts/check_source_integrity.py
