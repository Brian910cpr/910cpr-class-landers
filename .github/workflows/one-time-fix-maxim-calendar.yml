name: One-time Maxim calendar layout fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-fix-maxim-calendar.yml

permissions:
  contents: write

jobs:
  fix-calendar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Prevent month calendar bleed-over
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/corp/maxim.html')
          text = path.read_text(encoding='utf-8')
          old = '.months{display:grid;grid-template-columns:1fr 1fr;gap:10px}.month h3'
          new = '.months{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.month{min-width:0}.month h3'
          if old not in text:
              raise SystemExit('Expected Maxim calendar CSS was not found; no change made.')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/one-time-fix-maxim-calendar.yml
      - name: Commit live fix and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/corp/maxim.html .github/workflows/one-time-fix-maxim-calendar.yml
          git commit -m "fix: prevent Maxim calendar month overlap"
          git push origin main
