name: Refresh admin availability

on:
  workflow_dispatch:
    inputs:
      v2_release_probe:
        description: Read current sources and validate V2 without publication
        type: boolean
        default: false
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  push:
    branches:
      - main
      - integration/p0-demand-safety-20261119-r1
    paths:
      - '.github/workflows/refresh-admin-availability.yml'
      - 'scripts/build_sessions_current.py'
      - 'scripts/build_schedule_future.py'
      - 'scripts/fetch_hot_sync_snapshot.py'
      - 'scripts/export_calendar_snapshots.py'
      - 'scripts/build_live_availability_snapshot.py'
      - 'scripts/validate_public_refresh_output.py'
      - 'tests/test_validate_public_refresh_output.py'
      - 'tests/test_class_registration_routing.py'
      - 'tests/test_refresh_class_finder_index.py'
      - 'scripts/publish_admin_availability.py'
      - 'scripts/publish_admin_schedule.py'
      - 'scripts/publish_landerware_ical.py'
      - 'scripts/publish_scheduling_landscape.py'
      - 'scripts/publish_admin_reference_data.py'
      - 'scripts/block_start_time_selector.py'
      - 'tests/test_block_start_time_selector.py'
      - 'scripts/layered_selector_adapter.py'
      - 'scripts/layered_scheduling_engine.py'
      - 'tests/test_layered_selector_adapter.py'
      - 'tests/test_compare_current_main_draft_probe.py'
      - 'data/config/layered_scheduling_policy.json'
      - 'scripts/run_layered_release_probe.py'
      - 'scripts/compare_current_main_draft_probe.py'
      - 'tests/test_run_layered_release_probe.py'
      - 'scripts/layered_publication_adapter.py'
      - 'scripts/layered_day_cache.py'
      - 'scripts/build_bls_block_schedule_pilot.py'
      - 'scripts/anchor_state.py'
      - 'scripts/apply_anchor_seat_overrides.py'
      - 'scripts/apply_anchor_policy.py'
      - 'scripts/fetch_canonical_scheduling_demand.py'
      - 'scripts/canonical_scheduling_demand.py'
      - 'scripts/ensure_dashboard_refresh_controls.py'
      - 'scripts/validate_public_refresh_output.py'
      - 'data/runtime/anchor_seat_overrides.json'
      - 'data/config/people_catalog.json'
      - 'data/config/calendar_sources.json'
      - 'data/config/location_resource_map.json'
      - 'data/config/travel_time_rules.json'
      - 'data/config/block_schedule_pages.json'
      - 'data/config/anchor_schedule_policy.json'
      - 'data/config/course_catalog.json'
      - 'data/config/course_map.json'
      - 'data/inventory/course_consumption_rules.json'
      - 'tests/test_zero_duration_pipeline.py'
      - 'tests/test_layered_publication_adapter.py'
      - 'tests/test_layered_day_cache.py'
      - 'tests/fixtures/enrollware_zero_duration_20260929.json'

permissions:
  contents: write

jobs:
  refresh:
    concurrency:
      group: schedule-publish-main
      cancel-in-progress: false
    if: github.ref == 'refs/heads/main' && !inputs.v2_release_probe
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Serialized refreshes must build current main, not a queued event SHA.
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install python-dateutil openpyxl certifi==2025.10.5

      - name: Test scheduling reconciliation before generating output
        run: python -B -m unittest tests.test_zero_duration_pipeline tests.test_enrollware_ical_import tests.test_scheduling_reconciliation tests.test_canonical_scheduling_demand tests.test_apply_anchor_policy tests.test_anchor_state tests.test_publish_scheduling_landscape tests.test_native_public_anchor tests.test_layered_publication_adapter tests.test_layered_day_cache tests.test_validate_public_refresh_output

      - name: Refresh Enrollware seated and committed class source
        # Resolve occupied windows before canonical schedule, selectors or anchors.
        run: python -m scripts.build_sessions_current --source enrollware_ical

      - name: Fetch committed HOT_SYNC classes
        env:
          HOT_SYNC_ADMIN_KEY: ${{ secrets.HOT_SYNC_ADMIN_KEY }}
        run: python -m scripts.fetch_hot_sync_snapshot

      - name: Fetch current canonical registration demand
        env:
          HOT_SYNC_ADMIN_KEY: ${{ secrets.HOT_SYNC_ADMIN_KEY }}
        run: python -m scripts.fetch_canonical_scheduling_demand

      - name: Rebuild future seated schedule
        run: python -m scripts.build_schedule_future

      - name: Upload canonical demand fetch status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-demand-fetch-${{ github.run_id }}-${{ github.run_attempt }}
          path: debug/status/canonical_scheduling_demand_fetch.json
          if-no-files-found: error
          retention-days: 14

      - name: Apply confirmed seat counts
        run: python -m scripts.apply_anchor_seat_overrides

      - name: Publish schedule projection without participant truth
        run: python -m scripts.publish_admin_schedule

      - name: Publish combined LanderWare iCal feed
        run: python -m scripts.publish_landerware_ical

      - name: Refresh read-only calendar snapshots
        run: python -m scripts.export_calendar_snapshots

      - name: Build current live availability from calendar snapshots
        run: python -m scripts.build_live_availability_snapshot

      - name: Publish sanitized dashboard availability feed
        run: python -m scripts.publish_admin_availability

      - name: Rebuild selector feeds and their matching customer pages
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.block_start_time_selector import (
              build_block_schedule_page,
              load_block_schedule_page_configs,
          )
          from scripts.build_bls_block_schedule_pilot import (
              apply_final_live_availability_guard,
              public_selector_availability_payload,
              selector_availability_path,
              render_html,
              render_redirect_html,
          )

          configs = load_block_schedule_page_configs()
          for page_key, page_config in configs.items():
              payload = apply_final_live_availability_guard(build_block_schedule_page(page_config))
              if page_config.get("render_html") is not False:
                  html_path = Path(page_config["output_path"]).resolve()
                  html_path.parent.mkdir(parents=True, exist_ok=True)
                  rendered = render_html(payload)
                  html_path.write_text(rendered, encoding="utf-8")
                  for alias in page_config.get("alias_output_paths", []):
                      alias_path = Path(alias).resolve()
                      alias_path.parent.mkdir(parents=True, exist_ok=True)
                      alias_path.write_text(rendered, encoding="utf-8")
                  if page_config.get("legacy_schedule_path"):
                      legacy = Path(page_config["legacy_schedule_path"]).resolve()
                      legacy.parent.mkdir(parents=True, exist_ok=True)
                      legacy.write_text(render_redirect_html(legacy, html_path, page_config.get("title", "Schedule")), encoding="utf-8")
              output = selector_availability_path(page_key)
              output.parent.mkdir(parents=True, exist_ok=True)
              output.write_text(
                  json.dumps(public_selector_availability_payload(payload), separators=(",", ":"), ensure_ascii=False) + "\n",
                  encoding="utf-8",
              )
              print(f"Published {page_key}: {payload.get('counts', {}).get('publicSelectableStartTimeCount', 0)} selectable starts -> {output}")
          PY

      - name: Publish Scheduling Landscape diagnostic feed
        run: python -m scripts.publish_scheduling_landscape

      - name: Promote seated sessions and apply Anchor repeat policy
        run: |
          python -m unittest tests.test_anchor_state tests.test_apply_anchor_policy
          python -m scripts.apply_anchor_policy

      - name: Retain anonymous positive-demand V1 attribution diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-v1-positive-attribution-${{ github.run_id }}-${{ github.run_attempt }}
          path: debug/status/canonical_positive_v1_attribution.json
          if-no-files-found: warn
          retention-days: 14

      - name: Build durable seated Anchor session pages
        run: python -m scripts.build_landers --anchors-only --data-file docs/data/schedule_future.json

      - name: Refresh class finder and safe routes from this same seated snapshot
        run: |
          python -m scripts.refresh_public_class_artifacts
          python -B -m unittest tests.test_class_registration_routing tests.test_refresh_class_finder_index tests.test_verify_replayed_public_privacy
          # The source-backed gate must protect the ACTUAL scheduled publish,
          # not just the draft's read-only probe. Any leaked private identity
          # aborts before the Git commit and public deployment.
          python -B -m scripts.verify_replayed_public_privacy

      - name: Publish instructor and location reference feeds
        run: python -m scripts.publish_admin_reference_data

      - name: Ensure dashboard refresh controls are present
        run: python -m scripts.ensure_dashboard_refresh_controls

      - name: Report canonical source health
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('docs/data/admin_schedule.json').read_text())
          counts = p.get('counts', {})
          hot = p.get('sources', {}).get('hot_sync', {})
          print(f"Canonical schedule: {counts.get('sessions', 0)} total, {counts.get('enrollware_sessions', 0)} Enrollware, {counts.get('hot_sync_sessions_added', 0)} HOT_SYNC")
          if not hot.get('available'):
              print(f"::warning title=HOT_SYNC not merged::{hot.get('error') or 'HOT_SYNC snapshot unavailable'}")
          PY

      - name: Validate reconciled public inventory before publication
        run: python -m scripts.validate_public_refresh_output

      - name: Commit changed dashboard data
        run: |
          git config user.name "910CPR Availability Bot"
          git config user.email "actions@users.noreply.github.com"
          python - <<'PY'
          import subprocess
          from scripts.block_start_time_selector import load_block_schedule_page_configs
          paths = []
          for config in load_block_schedule_page_configs().values():
              if config.get('render_html') is False:
                  continue
              paths.extend([config['output_path'], *config.get('alias_output_paths', [])])
              if config.get('legacy_schedule_path'):
                  paths.append(config['legacy_schedule_path'])
          subprocess.run(['git', 'add', '--', *paths], check=True)
          PY
          git add \
            data/runtime/calendar_snapshots \
            data/audit/enrollware_ical_import_summary.json \
            data/audit/enrollware_ical_import_report.md \
            data/audit/calendar_snapshot_export_summary.json \
            data/audit/calendar_snapshot_export_report.md \
            data/audit/live_availability_snapshot_preview.json \
            data/audit/live_availability_snapshot_report.md \
            docs/data/schedule_future.json \
            docs/data/admin_schedule.json \
            docs/data/landerware.ics \
            docs/data/admin_availability.json \
            docs/data/admin_people.json \
            docs/data/admin_locations.json \
            docs/data/admin/scheduling_landscape.json \
            docs/data/anchor_state.json \
            docs/data/block-selector-availability \
            docs/classes \
            docs/sitemap.xml \
            docs/admin/dashboard.html \
            debug/status/build_sessions_current.json \
            debug/status/build_schedule_future.json
          if git diff --cached --quiet; then
            echo "No schedule, availability, selector, anchor, calendar, or admin reference changes to commit."
            exit 0
          fi
          git commit -m "Refresh canonical LanderWare schedule and calendar feed"

          # Generators also touch tracked diagnostics that are intentionally not
          # part of this publication commit. Rebase requires a clean worktree,
          # so discard only those uncommitted runner-local outputs after the
          # desired files have been committed.
          git status --short
          git restore --worktree .

          git fetch origin main
          if ! git rebase origin/main; then
            git rebase --abort || true
            echo "Remote main changed in a conflicting way. Refusing to overwrite newer schedule data."
            exit 1
          fi
          git push origin HEAD:main

  v2-release-probe:
    concurrency:
      group: v2-release-probe-${{ github.ref_name }}
      cancel-in-progress: false
    if: (github.event_name == 'workflow_dispatch' && inputs.v2_release_probe) || (github.event_name == 'push' && github.ref == 'refs/heads/integration/p0-demand-safety-20261119-r1')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install python-dateutil openpyxl certifi==2025.10.5
      - name: Read current Enrollware occurrences
        run: python -B -m scripts.build_sessions_current --source enrollware_ical
      - name: Read existing occupancy
        env:
          HOT_SYNC_ADMIN_KEY: ${{ secrets.HOT_SYNC_ADMIN_KEY }}
        run: python -B -m scripts.fetch_hot_sync_snapshot
      - name: Read current canonical registrations
        env:
          HOT_SYNC_ADMIN_KEY: ${{ secrets.HOT_SYNC_ADMIN_KEY }}
        run: python -B -m scripts.fetch_canonical_scheduling_demand
      - name: Refresh schedule and calendar inputs
        run: |
          python -B -m scripts.build_schedule_future
          python -B -m scripts.export_calendar_snapshots
          python -B -m scripts.build_live_availability_snapshot
      - name: Calculate actual V2 against fetched live source without publication
        shell: bash
        run: |
          # The full source replay is runner-local: never print class/private dates,
          # customer routes, or the underlying canonical payload in public logs.
          if ! python -B -m scripts.run_layered_release_probe >/tmp/v2_probe_private.log 2>&1; then
            echo "::error::Read-only V2 proof failed; no source, public, or payment state changed"
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          source = Path('data/runtime/audit_previews/v2_release_probe/proof.json')
          proof = json.loads(source.read_text(encoding='utf-8'))
          from scripts.run_layered_release_probe import public_safe_summary
          safe = public_safe_summary(proof)
          target = source.with_name('public_safe_summary.json')
          target.write_text(json.dumps(safe, indent=2), encoding='utf-8')
          print('Read-only V2 source replay:', json.dumps({'published': False, 'calculation_completed': safe['calculation_completed'], 'diagnostic_passed': safe['diagnostic_passed'], 'release_passed': safe['release_passed'], 'canonical_session_count': safe['canonical_session_count'], 'calendar_coverage_count': safe['calendar_coverage_count'], 'pages': sorted(safe['pages'])}))
          if not safe['calculation_completed'] or not safe['diagnostic_passed'] or not safe['source_snapshot_unchanged'] or not (safe['canonical_session_count'] or 0):
              raise SystemExit('V2 source proof incomplete: leaving public inventory and checkout unchanged')
          PY
      - name: Compare actual current-main and draft V2 selectors on frozen sources
        shell: bash
        run: |
          # Runner-only, separate engines; no push, external booking, or promotion.
          # All source/appointment diagnostics stay off public Actions logs.
          python -B -m scripts.compare_current_main_draft_probe
      - name: Replay same-source finder and detail pipeline in disposable checkout
        shell: bash
        run: |
          # Only the CI runner worktree changes. No push, deploy, purchase, or
          # source mutation; old public artifacts are not silently promoted.
          if ! python -B -m scripts.build_landers --anchors-only --data-file docs/data/schedule_future.json >/tmp/p0_landers.log 2>&1; then
            echo "::error::Disposably generated class details failed; no publication"
            exit 1
          fi
          if ! python -B -m scripts.refresh_public_class_artifacts >/tmp/p0_routes.log 2>&1; then
            echo "::error::Same-source finder/detail/sitemap reconciliation failed; no publication"
            exit 1
          fi
          if ! python -B -m unittest tests.test_class_registration_routing tests.test_refresh_class_finder_index >/tmp/p0_routing_tests.log 2>&1; then
            # Only test method names and counts are allowed into the public
            # CI summary. The raw failing assertion can contain source IDs.
            python - <<'PY'
          import json
          import re
          from pathlib import Path
          log = Path('/tmp/p0_routing_tests.log').read_text(encoding='utf-8', errors='replace')
          failures = sorted(set(re.findall(r'^(?:FAIL|ERROR): (test_[A-Za-z0-9_]+) \(', log, re.M)))
          summary = Path('data/runtime/audit_previews/v2_release_probe/public_safe_summary.json')
          evidence = json.loads(summary.read_text(encoding='utf-8'))
          evidence['coordinated_public_replay'] = {'result': 'blocked', 'test_case_names_only': failures}
          summary.write_text(json.dumps(evidence, indent=2), encoding='utf-8')
          print('Same-source routing regressions (names only):', failures)
          PY
            echo "::error::Refreshed public directory/detail regression failed; no publication"
            exit 1
          fi
          # A passing builder is insufficient if a public recommendation or
          # bookmarked numeric route still advertises a private appointment.
          # Check the *refreshed runner artifacts* against the same selected
          # source without printing source identifiers or appointment details.
          if ! python -B -m unittest tests.test_verify_replayed_public_privacy >/tmp/p0_privacy_tests.log 2>&1; then
            echo "::error::Synthetic private-route replay regression failed; no publication"
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.verify_replayed_public_privacy import verify
          counts = verify()
          summary = Path('data/runtime/audit_previews/v2_release_probe/public_safe_summary.json')
          evidence = json.loads(summary.read_text(encoding='utf-8'))
          evidence['coordinated_public_replay'] = {
              'result': 'source_checked_in_disposable_runner',
              'privacy_counts_only': counts,
              'hosted_public_booking_proven': False,
          }
          summary.write_text(json.dumps(evidence, indent=2), encoding='utf-8')
          print('Refreshed finder/detail/sitemap private-route proof:', counts)
          PY
          echo "Same-source public artifact rebuild, routing and privacy tests passed in runner only; deployment remains prohibited"
      - name: Enforce complete frozen-source release coverage
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('data/runtime/audit_previews/v2_release_probe')
          summary = json.loads((root / 'public_safe_summary.json').read_text(encoding='utf-8'))
          comparison = json.loads((root / 'same_source_main_draft_comparison.json').read_text(encoding='utf-8'))
          replay = summary.get('coordinated_public_replay') or {}
          # Expose only aggregate window counts already permitted in the safe report.
          # No dates, source IDs, raw exception messages, or registration routes.
          for family in sorted(summary.get('pages') or {}):
              counts = summary['pages'][family].get('counts') or {}
              print('Replay window counts:', family, json.dumps({
                  key: counts.get(key) if type(counts.get(key)) is int else None
                  for key in ('input_windows', 'evaluated_windows', 'failed_windows')
              }, sort_keys=True))
          # Fixed taxonomy only: never emit raw exception text or arbitrary map keys.
          categories = ('duplicate_source_identity', 'course_duration_policy_invalid',
                        'slot_grid_policy_invalid', 'unresolved_occupied_bounds',
                        'travel_assumption_unverified', 'commitment_coverage_unverified',
                        'instructor_unverified', 'resource_unverified',
                        'interval_unverified', 'other_window_error')
          for family in ('acls', 'arc', 'bls', 'family_cpr', 'heartsaver', 'hsi',
                         'pals', 'uscg_first_aid_cpr_aed'):
              row = (summary.get('pages') or {}).get(family) or {}
              reasons = row.get('failed_window_issue_categories') or {}
              safe_reasons = {key: reasons[key] for key in categories
                              if type(reasons.get(key)) is int and reasons[key] >= 0}
              print('Replay failed window categories:', family, json.dumps(safe_reasons, sort_keys=True))
              coverage = ((comparison.get('families') or {}).get(family) or {}).get('window_coverage') or {}
              for label in ('main', 'draft'):
                  values = coverage.get(label) or {}
                  print('Same source coverage:', family, label, json.dumps({
                      key: values.get(key) if type(values.get(key)) is int and values[key] >= 0 else None
                      for key in ('input_windows', 'evaluated_windows', 'failed_windows')
                  }, sort_keys=True))
          if not (
              summary.get('published') is False
              and summary.get('release_passed') is True
              and comparison.get('published') is False
              and comparison.get('same_source_verified') is True
              and comparison.get('draft_release_passed') is True
              and comparison.get('source_snapshot_sha256') == summary.get('source_snapshot_sha256')
              and comparison.get('replay_clock_utc') == summary.get('replay_clock_utc')
              and replay.get('result') == 'source_checked_in_disposable_runner'
          ):
              raise SystemExit('Frozen-source release coverage incomplete; diagnostics retained, no publication authorized')
          print('Frozen-source coverage and artifact replay passed; hosted verification remains separate')
          PY
      - name: Upload aggregate-only replay summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-safe-summary-${{ github.run_id }}
          path: |
            data/runtime/audit_previews/v2_release_probe/public_safe_summary.json
            data/runtime/audit_previews/v2_release_probe/same_source_main_draft_comparison.json
          if-no-files-found: warn
          retention-days: 7
