name: Native owner transport proof
on:
  push:
    branches: ['codex/native-only-checkout-20261111']
    paths: ['.github/workflows/native-owner-proof-once.yml']
permissions:
  contents: read
concurrency:
  group: native-owner-transport-proof
  cancel-in-progress: false
jobs:
  proof:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/native-only-checkout-20261111' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Invoke the single preauthorized owner proof
        env:
          HOT_SYNC_ADMIN_KEY: ${{ secrets.HOT_SYNC_ADMIN_KEY }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.error, urllib.request
          key = os.environ.get('HOT_SYNC_ADMIN_KEY', '')
          if not key:
              raise SystemExit('Owner authorization is unavailable; no request made.')
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener = urllib.request.build_opener(NoRedirect())
          request = urllib.request.Request(
              'https://wktwgcnwdvbebcobgyey.supabase.co/functions/v1/native-checkout-confirmations/proof',
              data=b'{}', method='POST',
              headers={'content-type': 'application/json', 'x-hot-sync-admin-key': key})
          try:
              with opener.open(request, timeout=35) as response:
                  data = json.loads(response.read(32768))
          except urllib.error.HTTPError as error:
              raise SystemExit('Owner proof HTTP ' + str(error.code) + '; no automatic retry.')
          except Exception:
              raise SystemExit('Owner proof outcome is uncertain; inspect the private ledger before any further action.')
          if data.get('proof', {}).get('state') != 'accepted':
              raise SystemExit('Owner proof was not accepted; inspect the private ledger. No retry performed.')
          # Never print response bodies, provider IDs, approval IDs or credentials.
          print('Owner transport proof accepted; verify mailbox independently.')
          PY
