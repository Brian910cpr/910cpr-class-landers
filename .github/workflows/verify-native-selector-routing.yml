name: Verify native selector routing
on:
  push:
    paths: ['scripts/build_bls_block_schedule_pilot.py', 'scripts/class_registration_routing.py', 'scripts/refresh_class_registration_routes.py', 'scripts/refresh_class_finder_index.py', 'scripts/build_landers.py', 'scripts/build_index_and_sitemap.py', 'data/config/native_class_checkout_capabilities.json', 'tests/test_class_registration_routing.py', 'docs/assets/resolved-selector-availability.js', 'tests/selector_native_routing.test.cjs', '.github/workflows/verify-native-selector-routing.yml']
  pull_request:
    paths: ['scripts/build_bls_block_schedule_pilot.py', 'scripts/class_registration_routing.py', 'scripts/refresh_class_registration_routes.py', 'scripts/refresh_class_finder_index.py', 'scripts/build_landers.py', 'scripts/build_index_and_sitemap.py', 'data/config/native_class_checkout_capabilities.json', 'tests/test_class_registration_routing.py', 'docs/assets/resolved-selector-availability.js', 'tests/selector_native_routing.test.cjs', '.github/workflows/verify-native-selector-routing.yml']
permissions:
  contents: read
jobs:
  routing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl python-dateutil tzdata
      - run: python -B -m scripts.refresh_class_finder_index && python -B -m scripts.refresh_class_registration_routes
      - run: python -B -m unittest tests.test_class_registration_routing tests.test_refresh_class_finder_index tests.test_public_session_landers tests.test_native_lander_metadata
      - run: node --test tests/selector_native_routing.test.cjs tests/resolved_selector_availability.test.mjs
