name: Seed LanderWare legacy media

on:
  push:
    branches:
      - codex/landerware-media-seed
    paths:
      - data/landerware/media/location-image-manifest.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror-location-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/landerware-media-seed

      - name: Mirror legacy location images
        run: |
          python - <<'PY'
          import json
          import mimetypes
          import pathlib
          import urllib.request
          import urllib.error

          manifest_path = pathlib.Path('data/landerware/media/location-image-manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          report = []

          headers = {
              'User-Agent': 'Mozilla/5.0 (compatible; 910CPR-LanderWare-Media-Mirror/1.0)'
          }

          for asset in manifest['assets']:
              url = asset['source_url']
              target = pathlib.Path(asset['repo_path'])
              target.parent.mkdir(parents=True, exist_ok=True)
              row = {
                  'source_url': url,
                  'repo_path': str(target),
                  'status': 'pending',
                  'content_type': None,
                  'bytes': 0,
                  'error': None,
              }
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      data = resp.read()
                      content_type = resp.headers.get_content_type()
                  target.write_bytes(data)
                  row['status'] = 'downloaded'
                  row['content_type'] = content_type
                  row['bytes'] = len(data)
              except Exception as exc:
                  row['status'] = 'failed'
                  row['error'] = f'{type(exc).__name__}: {exc}'
              report.append(row)

          report_path = pathlib.Path('data/landerware/media/location-image-download-report.json')
          report_path.parent.mkdir(parents=True, exist_ok=True)
          report_path.write_text(json.dumps({
              'source_manifest': str(manifest_path),
              'downloaded': sum(r['status'] == 'downloaded' for r in report),
              'failed': sum(r['status'] == 'failed' for r in report),
              'results': report,
          }, indent=2), encoding='utf-8')
          PY

      - name: Commit mirrored media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/landerware/media/legacy/location-images data/landerware/media/location-image-download-report.json
          if git diff --cached --quiet; then
            echo "No media changes to commit."
            exit 0
          fi
          git commit -m "Mirror legacy LanderWare location images"
          git push origin HEAD:codex/landerware-media-seed
