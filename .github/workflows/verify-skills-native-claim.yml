name: Verify native skills reservation
on:
  workflow_dispatch:
  pull_request:
    paths: ['supabase/functions/native-checkout-confirmations/**','supabase/functions/_shared/native-*','tests/native-resend-adapter.test.mjs','tests/native-checkout-email.test.mjs','tests/native-confirmation-consumer.test.mjs','tests/native-confirmation-service.test.mjs','tests/native-confirmation-postcommit.test.mjs','supabase/reviewed/*.sql','tests/helpers/native-checkout-closure-contract.sql','tests/native-checkout-hosted-compat.test.mjs','tests/helpers/native-checkout-legacy-hosted-functions.sql','supabase/migrations/*native_checkout_additive_order_runtime.sql','data/config/native_heartsaver_course_drafts.json','tests/heartsaver-checkout-drafts.test.mjs','supabase/migrations/*heartsaver_inactive_checkout_drafts.sql','docs/admin/production-summary.js','docs/admin/dashboard.html','tests/checkout-attention-ui.test.mjs','supabase/functions/production-board/**','tests/checkout-attention.test.mjs','tests/helpers/local-postgres.mjs','tests/helpers/native-checkout-migration-plan.mjs','tests/local-postgres-harness.test.mjs','tests/full-course-materialization.test.mjs','tests/learner-code-delivery.test.mjs','worker/learner-code-delivery.mjs','worker/checkout-confirmation.mjs','worker/checkout-email-template.mjs','worker/wrangler.checkout-confirmation.jsonc','tests/checkout_confirmation_worker.test.mjs','tests/checkout_email_template.test.mjs','supabase/config.toml','supabase/functions/public-registration/**','supabase/functions/_shared/checkout-*','supabase/migrations/*bls*.sql','supabase/migrations/*native_checkout*.sql','supabase/migrations/*native_full_course*.sql','supabase/migrations/*native_learner_code*.sql','supabase/migrations/*native_code_delivery_events.sql','tests/generic-checkout*','tests/native-checkout-profile*','tests/bls-bundle*','tests/reconciliation/**','tests/helpers/bls-checkout*','tests/helpers/native-checkout-profile*','docs/register/**','docs/assets/generic-checkout.js','docs/assets/checkout-profile.js','scripts/sync_checkout_profile.py','.github/workflows/verify-skills-native-claim.yml','scripts/validate_public_refresh_output.py','tests/test_validate_public_refresh_output.py','supabase/functions/skills-session-reservation/**','supabase/functions/stripe-registration-webhook/**','supabase/migrations/*skills*.sql','tests/skills-native*','tests/skills-checkout*','tests/helpers/skills-native*','tests/helpers/skills-checkout*','docs/register/skills-session/**','docs/assets/skills-reservation-client.js','docs/assets/skills-checkout-client.js']
permissions:
  contents: read
jobs:
  skills-claim:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: skills_claim_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl python-dateutil tzdata
      - run: python -m unittest tests.test_skills_session_509474.SkillsOnlyTests tests.test_layered_publication_adapter.LayeredPublicationTests tests.test_layered_selector_adapter.LayeredAdapterTests
      - run: python -m unittest tests.test_validate_public_refresh_output
      - run: npm install --no-save --ignore-scripts @electric-sql/pglite@0.5.15
      - run: node --experimental-strip-types --test tests/native-resend-adapter.test.mjs tests/native-checkout-email.test.mjs tests/native-confirmation-consumer.test.mjs tests/native-confirmation-service.test.mjs tests/native-confirmation-postcommit.test.mjs tests/reconciliation/native-resend-consumer.test.mjs tests/skills-native-handler.test.mjs tests/skills-native-adapter.test.mjs tests/skills-native-sql.test.mjs tests/skills-checkout.test.mjs tests/skills-checkout-form.test.mjs tests/skills-checkout-webhook.test.mjs tests/generic-checkout.test.mjs tests/generic-checkout-adapter.test.mjs tests/heartsaver-checkout-drafts.test.mjs tests/native-checkout-hosted-compat.test.mjs tests/native-checkout-generated-lifecycle.test.mjs tests/native-checkout-profile.test.mjs tests/native-checkout-profile-sql.test.mjs tests/bls-bundle.test.mjs tests/bls-bundle-handler.test.mjs tests/reconciliation/native-checkout.test.mjs tests/reconciliation/addon-sellability.test.mjs tests/reconciliation/public-inventory.test.mjs tests/reconciliation/checkout-confirmation.test.mjs tests/public_registration_option_errors.test.cjs tests/native_registration_closure.test.cjs tests/shared_checkout_bootstrap.test.cjs tests/checkout_confirmation_worker.test.mjs tests/checkout_email_template.test.mjs tests/local-postgres-harness.test.mjs tests/full-course-materialization.test.mjs tests/learner-code-delivery.test.mjs tests/checkout-attention.test.mjs tests/checkout-attention-ui.test.mjs
      - name: Verify real concurrent claims in isolated PostgreSQL
        env:
          SKILLS_TEST_DATABASE: skills_claim_test
        run: |
          psql -h 127.0.0.1 -U postgres -d skills_claim_test -v ON_ERROR_STOP=1 \
            -f tests/helpers/reschedule-production-schema.sql \
            -f supabase/migrations/20261019175346_registration_self_service_rescheduling.sql \
            -f supabase/migrations/20261019175522_reschedule_confirmation_provider.sql \
            -f supabase/migrations/20261019225039_registration_reschedule_dynamic_offers.sql \
            -f supabase/migrations/20261106180848_skills_session_native_claim.sql \
            -f tests/helpers/skills-native-workspace-guards.sql \
            -f tests/helpers/skills-checkout-documents.sql \
            -f supabase/migrations/20261108142206_skills_checkout_and_optional_certificate.sql
          node tests/skills-native-concurrency.mjs
          node tests/skills-checkout-concurrency.mjs
      - name: Verify mixed native orders and code stock on independent PostgreSQL connections
        env:
          NATIVE_CHECKOUT_TEST_DATABASE: native_checkout_test
        run: |
          createdb -h 127.0.0.1 -U postgres native_checkout_test
          node tests/generic-checkout-concurrency.mjs
  selector-preview:
    # Dedicated race refs never access production scheduling inputs/secrets.
    if: ${{ !startsWith(github.head_ref || github.ref_name, 'codex/checkout-pg17-validation-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt openpyxl python-dateutil tzdata
      - name: Fetch current read-only scheduling inputs
        env:
          HOT_SYNC_ADMIN_KEY: ${{ secrets.HOT_SYNC_ADMIN_KEY }}
        run: |
          python -m scripts.fetch_canonical_scheduling_demand
          python -m scripts.export_calendar_snapshots
          python -m scripts.build_live_availability_snapshot
          python -m scripts.build_sessions_current
          python -m scripts.build_schedule_future
      - name: Build only the three skills selectors
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone
          from scripts.build_bls_block_schedule_pilot import run_page
          from scripts.validate_public_refresh_output import validate_selector, session_rows
          p=Path('data/config/native_skills_activation.json')
          p.write_text(json.dumps({'schemaVersion':'native-skills-activation.v1','enabled':True,'canonicalVerifiedAt':datetime.now(timezone.utc).isoformat(),'evidence':'isolated-review-preview'}))
          for key in ['heartsaver','arc','hsi']:
              result=run_page(key)
              session_ids={str(s.get('session_id') or s.get('sessionId') or s.get('id')) for s in session_rows(json.loads(Path('docs/data/schedule_future.json').read_text()))}
              validate_selector(key,session_ids)
              print(key, {k:v for k,v in result.items() if k!='output_paths'})
              data=json.loads(Path(f'docs/data/block-selector-availability/{key}.json').read_text())
              offers=[o for d in data['dates'] for t in d['startTimes'] for o in t['courses'] if o['courseId']=='509474']
              assert offers, f'No skills offers for {key}'
              print(key, 'native skills offers',len(offers))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: skills-selector-preview
          path: |
            docs/heartsaver.html
            docs/arc.html
            docs/hsi.html
            docs/data/block-selector-availability/
            docs/assets/
            docs/img/
            docs/register/skills-session/
          retention-days: 1

