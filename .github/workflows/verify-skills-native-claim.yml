name: Verify native skills reservation
on:
  workflow_dispatch:
    inputs:
      advanced_only:
        description: Run only isolated advanced checkout and basket PostgreSQL proof
        type: boolean
        default: false
  pull_request:
    paths: ['tests/test_native_bls_publication_browser.py','tests/native_bls_browser_fixtures.py','tests/test_native_bls_browser_fixtures.py','tests/helpers/native-bls-browser-model.mjs','tests/native-full-policy-rpc-compat.test.mjs','tests/test_native_heartsaver_publication*.py','tests/native-heartsaver-publication*','tests/native_heartsaver_demand_endpoint.test.cjs','supabase/migrations/*native_heartsaver_publication.sql','tests/native-heartsaver-full*','supabase/migrations/*native_heartsaver_full_course_scopes.sql','tests/helpers/isolated-postgres-address.mjs','tests/isolated-postgres-address.test.mjs','tests/native-skills-seated*','tests/helpers/native-skills-seated-publication.py','scripts/run-local-skills-seats-pg17.sh','.github/workflows/refresh-public-site.yml','.github/workflows/refresh-admin-availability.yml','scripts/fetch_canonical_scheduling_demand.py','tests/test_fetch_canonical_scheduling_demand.py','tests/native-confirmation-scheduler-*','tests/native-scheduler-*','tests/helpers/native-scheduler-concurrency-schema.sql','supabase/migrations/*native_confirmation_minute_scheduler_disabled.sql','supabase/reviewed/native-confirmation-scheduler/*.sql','scripts/maintain_native_publication.py','tests/test_native_publication_maintenance.py','tests/native-publication-maintenance*','supabase/migrations/*native_publication_maintenance.sql','tests/test_native_seated_publication.py','tests/native-seated-publication-reader.test.mjs','docs/assets/resolved-selector-availability.js','tests/native-demand-snapshot*','tests/native_demand_snapshot_endpoint.test.cjs','tests/native-full-lifecycle-hooks.test.mjs','supabase/migrations/*native_scheduling_seat_snapshot.sql','tests/helpers/native-demand-snapshot-schema.sql','scripts/run_native_publication.py','tests/test_native_publication_runner.py','tests/test_native_skills_publication*.py','tests/native-skills-publication*.test.mjs','.github/workflows/publish-native-availability.yml','scripts/native_publication_scope.py','data/config/native_publication_scope.json','tests/test_native_publication_scope.py','tests/test_native_publication_wiring.py','tests/test_native_full_publication_validator.py','tests/native-publication-reader.test.mjs','tests/native-full-v2-policy.test.mjs','tests/helpers/native-full-service-role-acl.sql','supabase/functions/canonical-scheduling-demand/**','tests/native_demand_authority.test.cjs','tests/test_native_demand_consumer.py','supabase/migrations/*native_owner_transport_proof.sql','tests/native-owner-proof.test.mjs','supabase/migrations/*native_session_authority*.sql','tests/inactive-bls-profiles.test.mjs','tests/helpers/inactive-bls-profile-*','tests/helpers/native-bls-inactive-validator.sql','worker/native-confirmation-*.mjs','scripts/check-native-confirmations.mjs','tests/native-confirmation-monitor.test.mjs','.github/workflows/native-confirmation-health.yml','.github/workflows/native-confirmation-retry.yml','supabase/functions/native-checkout-confirmations/**','supabase/functions/_shared/native-*','tests/native-resend-adapter.test.mjs','tests/native-checkout-email.test.mjs','tests/native-confirmation-consumer.test.mjs','tests/native-confirmation-service.test.mjs','tests/native-confirmation-postcommit.test.mjs','supabase/reviewed/*.sql','tests/helpers/native-checkout-closure-contract.sql','tests/native-checkout-hosted-compat.test.mjs','tests/helpers/native-checkout-legacy-hosted-functions.sql','supabase/migrations/*native_checkout_additive_order_runtime.sql','data/config/native_heartsaver_course_drafts.json','tests/heartsaver-checkout-drafts.test.mjs','supabase/migrations/*heartsaver_inactive_checkout_drafts.sql','docs/admin/production-summary.js','docs/admin/dashboard.html','tests/checkout-attention-ui.test.mjs','supabase/functions/production-board/**','tests/checkout-attention.test.mjs','tests/helpers/isolated-postgres-address.mjs','tests/isolated-postgres-address.test.mjs','tests/helpers/local-postgres.mjs','tests/helpers/native-checkout-migration-plan.mjs','tests/local-postgres-harness.test.mjs','tests/full-course-materialization.test.mjs','tests/learner-code-delivery.test.mjs','worker/learner-code-delivery.mjs','worker/checkout-confirmation.mjs','worker/checkout-email-template.mjs','worker/wrangler.checkout-confirmation.jsonc','tests/checkout_confirmation_worker.test.mjs','tests/checkout_email_template.test.mjs','supabase/config.toml','supabase/functions/public-registration/**','supabase/functions/_shared/checkout-*','supabase/migrations/*bls*.sql','supabase/migrations/*native_checkout*.sql','supabase/migrations/*native_full_course*.sql','supabase/migrations/*native_learner_code*.sql','supabase/migrations/*native_code_delivery_events.sql','tests/generic-checkout*','tests/native-checkout-profile*','tests/bls-bundle*','tests/reconciliation/**','tests/helpers/bls-checkout*','tests/helpers/native-checkout-profile*','docs/register/**','docs/assets/generic-checkout.js','docs/assets/checkout-profile.js','scripts/sync_checkout_profile.py','.github/workflows/verify-skills-native-claim.yml','scripts/validate_public_refresh_output.py','tests/test_validate_public_refresh_output.py','supabase/functions/skills-session-reservation/**','supabase/functions/stripe-registration-webhook/**','supabase/migrations/*skills*.sql','tests/skills-native*','tests/skills-checkout*','tests/helpers/skills-native*','tests/helpers/skills-checkout*','docs/register/skills-session/**','docs/assets/skills-reservation-client.js','docs/assets/skills-checkout-client.js']
permissions:
  contents: read
jobs:
  skills-claim:
    if: ${{ inputs.advanced_only != true }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: skills_claim_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl python-dateutil tzdata
      - run: python -m unittest tests.test_skills_session_509474.SkillsOnlyTests tests.test_layered_publication_adapter.LayeredPublicationTests tests.test_layered_selector_adapter.LayeredAdapterTests
      - run: python -m unittest tests.test_native_heartsaver_publication tests.test_native_publication_maintenance tests.test_native_seated_publication tests.test_native_publication_runner tests.test_native_skills_publication_runner tests.test_native_skills_publication tests.test_native_skills_publication_validator tests.test_native_publication_scope tests.test_native_publication_wiring tests.test_native_full_publication_validator tests.test_native_demand_consumer
      - run: python -m unittest tests.test_fetch_canonical_scheduling_demand
      - run: python -m unittest tests.test_validate_public_refresh_output
      - run: npm install --no-save --ignore-scripts @electric-sql/pglite@0.5.15
      - run: node --experimental-strip-types --test --test-concurrency=2 tests/advanced-publication-roundtrip.test.mjs tests/native_advanced_demand_endpoint.test.cjs tests/advanced-course.test.mjs tests/advanced-course-sql.test.mjs tests/checkout-components.test.mjs tests/combined-checkout.test.mjs tests/combined-checkout-sql.test.mjs tests/native-heartsaver-publication.test.mjs tests/native_heartsaver_demand_endpoint.test.cjs tests/native-confirmation-scheduler-handler.test.mjs tests/native-confirmation-scheduler-sql.test.mjs tests/native-confirmation-scheduler-budget.test.mjs tests/native-publication-maintenance.test.mjs tests/native-publication-maintenance-endpoint.test.cjs tests/native-seated-publication-reader.test.mjs tests/native-demand-snapshot.test.mjs tests/native_demand_snapshot_endpoint.test.cjs tests/native-full-lifecycle-hooks.test.mjs tests/native-full-v2-policy.test.mjs tests/native-full-policy-rpc-compat.test.mjs tests/native-heartsaver-full-scopes.test.mjs tests/native-publication-reader.test.mjs tests/native-skills-publication-reader.test.mjs tests/native-skills-publication-sql.test.mjs tests/native-skills-seated.test.mjs tests/native_demand_authority.test.cjs tests/native-owner-proof.test.mjs tests/inactive-bls-profiles.test.mjs tests/native-confirmation-monitor.test.mjs tests/native-scheduler-observer.test.mjs tests/native-resend-adapter.test.mjs tests/native-checkout-email.test.mjs tests/native-confirmation-consumer.test.mjs tests/native-confirmation-service.test.mjs tests/native-confirmation-postcommit.test.mjs tests/reconciliation/native-resend-consumer.test.mjs tests/reconciliation/native-session-authority.test.mjs tests/skills-native-handler.test.mjs tests/skills-native-adapter.test.mjs tests/skills-native-sql.test.mjs tests/skills-checkout.test.mjs tests/skills-checkout-form.test.mjs tests/skills-checkout-webhook.test.mjs tests/generic-checkout.test.mjs tests/generic-checkout-adapter.test.mjs tests/heartsaver-checkout-drafts.test.mjs tests/native-checkout-hosted-compat.test.mjs tests/native-checkout-generated-lifecycle.test.mjs tests/native-checkout-profile.test.mjs tests/native-checkout-profile-sql.test.mjs tests/bls-bundle.test.mjs tests/bls-bundle-handler.test.mjs tests/reconciliation/native-checkout.test.mjs tests/reconciliation/addon-sellability.test.mjs tests/reconciliation/public-inventory.test.mjs tests/reconciliation/checkout-confirmation.test.mjs tests/public_registration_option_errors.test.cjs tests/native_registration_closure.test.cjs tests/shared_checkout_bootstrap.test.cjs tests/checkout_confirmation_worker.test.mjs tests/checkout_email_template.test.mjs tests/isolated-postgres-address.test.mjs tests/local-postgres-harness.test.mjs tests/full-course-materialization.test.mjs tests/learner-code-delivery.test.mjs tests/checkout-attention.test.mjs tests/checkout-attention-ui.test.mjs
      - name: Verify real concurrent claims in isolated PostgreSQL
        env:
          SKILLS_TEST_DATABASE: skills_claim_test
        run: |
          psql -h 127.0.0.1 -U postgres -d skills_claim_test -v ON_ERROR_STOP=1 \
            -f tests/helpers/reschedule-production-schema.sql \
            -f supabase/migrations/20261019175346_registration_self_service_rescheduling.sql \
            -f supabase/migrations/20261019175522_reschedule_confirmation_provider.sql \
            -f supabase/migrations/20261019225039_registration_reschedule_dynamic_offers.sql \
            -f supabase/migrations/20261106180848_skills_session_native_claim.sql \
            -f tests/helpers/skills-native-workspace-guards.sql \
            -f tests/helpers/skills-checkout-documents.sql \
            -f supabase/migrations/20261108142206_skills_checkout_and_optional_certificate.sql
          node tests/skills-native-concurrency.mjs
          node tests/skills-checkout-concurrency.mjs
      - name: Verify mixed native orders and code stock on independent PostgreSQL connections
        env:
          NATIVE_CHECKOUT_TEST_DATABASE: native_checkout_test
        run: |
          createdb -h 127.0.0.1 -U postgres native_checkout_test
          node tests/generic-checkout-concurrency.mjs
      - name: Verify native shared skills remaining seats on PostgreSQL17
        env:
          NATIVE_TEST_POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          createdb -h 127.0.0.1 -U postgres skills_claim_test_509474
          node tests/native-skills-seated-concurrency.mjs
      - name: Verify inactive Heartsaver scopes on PostgreSQL17
        env:
          NATIVE_TEST_POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          createdb -h 127.0.0.1 -U postgres skills_claim_test_344085
          node tests/native-heartsaver-full-concurrency.mjs
      - name: Verify scoped Heartsaver admission snapshots on PostgreSQL17
        env:
          NATIVE_TEST_POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          createdb -h 127.0.0.1 -U postgres skills_claim_test_223000
          node tests/native-heartsaver-publication-concurrency.mjs
      - name: Verify combined advanced course checkout on PostgreSQL17
        env:
          NATIVE_TEST_POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          createdb -h 127.0.0.1 -U postgres skills_claim_test_991113
          node tests/combined-checkout-concurrency.mjs
      - name: Verify atomic native demand snapshots on independent PostgreSQL connections
        env:
          NATIVE_TEST_POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          createdb -h 127.0.0.1 -U postgres native_demand_snapshot_test
          node tests/native-demand-snapshot-concurrency.mjs
  scheduler-race:
    if: ${{ inputs.advanced_only != true }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: native_scheduler_concurrency_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify minute scheduler admission on independent PostgreSQL connections
        env:
          NATIVE_SCHEDULER_TEST_PORT: '5432'
          NATIVE_TEST_POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: node tests/native-scheduler-concurrency.mjs
  browser-contracts:
    if: ${{ inputs.advanced_only != true }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl python-dateutil tzdata playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - name: Verify advanced native selector routes and source expiry without external requests
        run: python -B -m unittest tests.test_native_advanced_publication_browser -v
      - name: Verify native Heartsaver selectors without external requests
        run: python -B -m unittest tests.test_native_heartsaver_publication_browser -v
      - name: Verify combined course form with in-memory API and payment boundaries
        run: python -B -m unittest tests.test_combined_checkout_browser -v
      - name: Verify native BLS packages and legacy55 links without external requests
        run: python -B -m unittest tests.test_native_bls_browser_fixtures tests.test_native_bls_publication_browser -v
  advanced-checkout-proof:
    if: ${{ inputs.advanced_only == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: skills_claim_test_991113
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --ignore-scripts @electric-sql/pglite@0.5.15
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl python-dateutil tzdata
      - name: Verify advanced publication and existing publisher contracts
        run: python -B -m unittest tests.test_native_advanced_publication tests.test_native_publication_runner tests.test_layered_publication_adapter tests.test_fetch_canonical_scheduling_demand tests.test_validate_public_refresh_output
      - name: Verify advanced pricing, API, materialization and basket fixtures
        run: node --test --test-concurrency=2 tests/advanced-publication-roundtrip.test.mjs tests/native_advanced_demand_endpoint.test.cjs tests/advanced-course.test.mjs tests/advanced-course-sql.test.mjs tests/checkout-components.test.mjs tests/combined-checkout.test.mjs tests/combined-checkout-sql.test.mjs tests/generic-checkout.test.mjs tests/generic-checkout-adapter.test.mjs tests/skills-checkout-webhook.test.mjs
      - name: Verify basket claims and payment finalization on independent PostgreSQL17 connections
        env:
          NATIVE_TEST_POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: node tests/combined-checkout-concurrency.mjs
  selector-preview:
    # Dedicated race refs never access production scheduling inputs/secrets.
    if: ${{ inputs.advanced_only != true && !startsWith(github.head_ref || github.ref_name, 'codex/checkout-pg17-validation-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt openpyxl python-dateutil tzdata
      - name: Fetch current read-only scheduling inputs
        env:
          HOT_SYNC_ADMIN_KEY: ${{ secrets.HOT_SYNC_ADMIN_KEY }}
        run: |
          python -m scripts.fetch_canonical_scheduling_demand
          python -m scripts.export_calendar_snapshots
      - name: Build and validate native-only BLS preview
        run: python -m scripts.run_native_publication build --preview
      - uses: actions/upload-artifact@v4
        with:
          name: skills-selector-preview
          path: |
            docs/bls.html
            docs/data/block-selector-availability/bls.json
            docs/assets/
            docs/img/
            docs/register/skills-session/
          retention-days: 1

