name: Verify native skills reservation
on:
  workflow_dispatch:
  pull_request:
    paths: ['.github/workflows/verify-skills-native-claim.yml','scripts/validate_public_refresh_output.py','tests/test_validate_public_refresh_output.py','supabase/functions/skills-session-reservation/**','supabase/migrations/*skills_session_native_claim.sql','tests/skills-native*','tests/helpers/skills-native*','docs/assets/skills-reservation-client.js']
permissions:
  contents: read
jobs:
  skills-claim:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: skills_claim_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl python-dateutil tzdata
      - run: python -m unittest tests.test_skills_session_509474.SkillsOnlyTests tests.test_layered_publication_adapter.LayeredPublicationTests tests.test_layered_selector_adapter.LayeredAdapterTests
      - run: python -m unittest tests.test_validate_public_refresh_output
      - run: npm install --no-save --ignore-scripts @electric-sql/pglite@0.5.15
      - run: node --experimental-strip-types --test tests/skills-native-handler.test.mjs tests/skills-native-adapter.test.mjs tests/skills-native-sql.test.mjs
      - name: Verify real concurrent claims in isolated PostgreSQL
        env:
          SKILLS_TEST_DATABASE: skills_claim_test
        run: |
          psql -h 127.0.0.1 -U postgres -d skills_claim_test -v ON_ERROR_STOP=1 \
            -f tests/helpers/reschedule-production-schema.sql \
            -f supabase/migrations/20261019175346_registration_self_service_rescheduling.sql \
            -f supabase/migrations/20261019175522_reschedule_confirmation_provider.sql \
            -f supabase/migrations/20261019225039_registration_reschedule_dynamic_offers.sql \
            -f supabase/migrations/20261106180848_skills_session_native_claim.sql \
            -f tests/helpers/skills-native-workspace-guards.sql
          node tests/skills-native-concurrency.mjs
  selector-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt openpyxl python-dateutil tzdata
      - name: Fetch current read-only scheduling inputs
        env:
          HOT_SYNC_ADMIN_KEY: ${{ secrets.HOT_SYNC_ADMIN_KEY }}
        run: |
          python -m scripts.fetch_canonical_scheduling_demand
          python -m scripts.export_calendar_snapshots
          python -m scripts.build_live_availability_snapshot
          python -m scripts.build_sessions_current
          python -m scripts.build_schedule_future
      - name: Build only the three skills selectors
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone
          from scripts.build_bls_block_schedule_pilot import run_page
          from scripts.validate_public_refresh_output import validate_selector, session_rows
          p=Path('data/config/native_skills_activation.json')
          p.write_text(json.dumps({'schemaVersion':'native-skills-activation.v1','enabled':True,'canonicalVerifiedAt':datetime.now(timezone.utc).isoformat(),'evidence':'isolated-review-preview'}))
          for key in ['heartsaver','arc','hsi']:
              result=run_page(key)
              session_ids={str(s.get('session_id') or s.get('sessionId') or s.get('id')) for s in session_rows(json.loads(Path('docs/data/schedule_future.json').read_text()))}
              validate_selector(key,session_ids)
              print(key, {k:v for k,v in result.items() if k!='output_paths'})
              data=json.loads(Path(f'docs/data/block-selector-availability/{key}.json').read_text())
              offers=[o for d in data['dates'] for t in d['startTimes'] for o in t['courses'] if o['courseId']=='509474']
              assert offers, f'No skills offers for {key}'
              print(key, 'native skills offers',len(offers))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: skills-selector-preview
          path: |
            docs/heartsaver.html
            docs/arc.html
            docs/hsi.html
            docs/data/block-selector-availability/
            docs/assets/
            docs/img/
            docs/register/skills-session/
          retention-days: 1
