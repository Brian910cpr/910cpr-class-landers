<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>LanderWare Schedule Manager</title><link rel="stylesheet" href="style.css"></head><body>
<header><div><b>LANDERWARE</b><span>Schedule Manager</span></div><button id="open-add" class="primary">+ ADD CLASS</button></header>
<main><section id="confirmation" class="confirmation" hidden></section><h1>Upcoming classes</h1><div id="class-list">Loading…</div></main>
<dialog id="class-dialog"><form id="class-form"><div class="head"><h2>Add class</h2><button type="button" id="close-dialog">×</button></div>
<label>Course<select name="course_key" id="course" required><option value="aha_bls_provider">BLS Initial</option><option value="aha_bls_provider_renewal">BLS Renewal</option><option value="aha_heartcode_bls">HeartCode BLS</option><option value="aha_acls_provider_initial">ACLS Initial</option><option value="aha_acls_provider_renewal">ACLS Renewal</option><option value="aha_pals_provider">PALS Initial</option><option value="aha_pals_renewal">PALS Renewal</option><option value="aha_heartsaver_first_aid_cpr_aed">Heartsaver First Aid CPR AED</option></select></label>
<div class="pair"><label>Date<input name="date" type="date" required></label><label>Start time<input name="start_time" type="time" required></label></div>
<label>Instructor<select name="instructor"><option>Brian Ennis</option><option>Amy Arnold</option><option>Nicholas Tripp</option></select></label>
<label>Location<select name="location_name"><option value=":: Wilmington; Shipyard Blvd - B">Shipyard Room B</option><option value=":: Wilmington; Shipyard Blvd - A">Shipyard Room A</option><option value=":: Wilmington; Shipyard Blvd - C">Shipyard Room C</option></select></label>
<div class="pair"><label>Visibility<select name="visibility"><option value="public">Public</option><option value="private">Private / committed client class</option></select></label><label>Capacity<input name="capacity" id="capacity" type="number" min="1" value="6"></label></div>
<fieldset><legend>Participants <small>(optional)</small></legend><div id="participants"></div><button type="button" id="add-participant">+ Add another</button></fieldset><p id="error" role="alert"></p><button class="primary submit">ADD CLASS</button></form></dialog>
<script src="app.js"></script></body></html>
