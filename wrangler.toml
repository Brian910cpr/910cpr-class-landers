name = "free-time-offer-worker"
main = "worker/free-time-offer-worker.js"
compatibility_date = "2026-06-05"
workers_dev = true

# Worker Custom Domain. Cloudflare creates the DNS record and certificate for
# this subdomain; the Worker remains responsible for path-level routing.
routes = [
  { pattern = "schedule.910cpr.com", zone_name = "910cpr.com", custom_domain = true }
]

[vars]
CREATION_ENABLED = "false"
DRY_RUN = "true"
ALLOW_PUBLIC_CREATION = "false"
