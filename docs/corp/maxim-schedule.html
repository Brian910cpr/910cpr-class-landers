<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Choose Your Maxim CPR Class · 910CPR</title><style>:root{font:16px/1.45 system-ui,sans-serif;color:#162536;background:#f2f5f7}*{box-sizing:border-box}body{margin:0}header{background:#10293d;color:#fff;padding:18px}main{max-width:680px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #d7dee5;border-radius:10px;padding:16px;margin:12px 0}h1{font-size:22px;margin:0}h2{font-size:18px}.context{border-left:4px solid #1477aa}label{display:grid;font-weight:700;margin:9px 0}input{padding:10px;border:1px solid #aeb9c4;border-radius:7px;font:inherit}button{padding:10px 12px;border:1px solid #0b679f;border-radius:7px;background:#0b679f;color:white;font-weight:750;margin:4px}.date{background:white;color:#0b679f}.date[disabled]{color:#777;border-color:#bbb}.notice{font-size:13px;color:#526071}.error{color:#a52828}</style></head><body><header><h1>Choose Your Maxim CPR Class</h1></header><main id="app"><p>Opening your secure scheduling task…</p></main><script>
const API='https://vzzytydeorpthqnupzvt.supabase.co/functions/v1/maxim-portal',token=new URLSearchParams(location.search).get('t'),app=document.getElementById('app');let context,selected;
const esc=value=>String(value??'').replace(/[<>&"]/g,char=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[char]));
const locationKey=course=>{const value=String(course.location||course.location_name||course.public_location||'').toLowerCase();return value.includes('wilmington')||value.includes('shipyard')?'wilmington':value.includes('holly ridge')||value.includes('jacksonville')||value.includes('onslow')?'holly-ridge-jacksonville':''};
const slotKey=course=>[course.courseId,course.date,course.startTime,course.appointmentDayId||'',course.availabilityBlockId||''].join('|');
async function api(method='GET',body){const response=await fetch(`${API}/self-service/${encodeURIComponent(token||'')}`,{method,headers:{'content-type':'application/json'},body:body?JSON.stringify(body):undefined}),data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'This scheduling task is unavailable.');return data}
async function load(){try{context=await api();render();await availability()}catch(error){app.innerHTML=`<section class="card"><h2>We couldn’t open this scheduling task</h2><p class="error">${esc(error.message)}</p><p>Contact 910CPR at <a href="tel:+19103955193">910-395-5193</a> for help.</p></section>`}}
function render(){const p=context.person,r=context.requirement;app.innerHTML=`<section class="card context"><h2>${esc(p.firstName)} ${esc(p.lastName)}</h2><p><b>${esc(r.course_name)}</b> has been pre-selected.</p><p><b>When would you like to attend?</b></p><p class="notice">Choose a class from today through and including ${esc(r.expiration_date)}.</p></section><section class="card"><h2>Contact information</h2><label>First name<input id="first" value="${esc(p.firstName)}"></label><label>Last name<input id="last" value="${esc(p.lastName)}"></label><label>Email<input id="email" type="email" value="${esc(p.email)}"></label><button id="save">Save corrections</button><p class="notice">Your required program and Maxim billing relationship cannot be changed here.</p></section><section class="card"><h2>Available classes</h2><div id="classes">Loading legitimate public availability…</div><p class="notice">Course fees are set and charged by 910CPR / Coastal CPR Training and are not charged by the American Heart Association.</p></section>`;save.onclick=async()=>{await api('PATCH',{firstName:first.value,lastName:last.value,email:email.value});save.textContent='Saved'} }
async function availability(){const selector=String(context.requirement.course_name).toLowerCase().includes('bls')?'bls':'heartsaver',payload=await fetch(`/data/block-selector-availability/${selector}.json`,{cache:'no-store'}).then(response=>response.json()),today=context.allowedDateRange.startsOn,ends=context.allowedDateRange.endsOn,choices=[];for(const day of payload.dates||[]){if(day.date<today||day.date>ends)continue;for(const time of day.startTimes||[])for(const course of time.courses||[])if(String(course.courseId)===String(context.requirement.course_id))choices.push({...course,date:day.date,startTime:time.startTime})}classes.innerHTML=choices.map((course,index)=>`<button class="date" data-index="${index}">${esc(course.date)} · ${esc(course.startTime)}</button>`).join('')||`<p>No qualifying class is currently available before your expiration date. Contact <a href="tel:+19103955193">910CPR at 910-395-5193</a> for help.</p>`;classes.querySelectorAll('button').forEach(button=>button.onclick=async()=>{selected=choices[Number(button.dataset.index)];if(!confirm(`Register for ${selected.date} at ${selected.startTime}?`))return;try{const result=await api('POST',{courseId:context.requirement.course_id,date:selected.date,startTime:selected.startTime,slotKey:slotKey(selected),locationKey:locationKey(selected)});app.innerHTML=`<section class="card"><h2>You’re registered</h2><p>Your ${esc(context.requirement.course_name)} class is scheduled for ${esc(selected.date)} at ${esc(selected.startTime)}.</p><p>A confirmation message has been prepared. Contact 910CPR at 910-395-5193 if you need help.</p><p class="notice">Registration ID: ${esc(result.registrationId)}</p></section>`}catch(error){alert(error.message)}})}
if(token)load();else app.innerHTML='<section class="card"><h2>Scheduling link required</h2><p>Use the employee-specific link from your Maxim scheduling email.</p></section>';
</script></body></html>
