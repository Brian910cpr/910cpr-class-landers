<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Schedule Maxim CPR Training | 910CPR</title>
<link rel="stylesheet" href="/assets/site-theme.css?v=20260818.5">
<script src="/assets/resolved-selector-availability.js?v=20260723.1"></script>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;font:15px/1.45 Arial,Helvetica,sans-serif;background:#08111f;color:#e7eef7}main{max-width:980px;margin:auto;padding:24px}.card{background:#111b2b;border:1px solid #26364c;border-radius:16px;padding:20px;box-shadow:0 16px 45px rgba(0,0,0,.28)}h1{margin:0 0 4px}.muted{color:#9fb0c4}.summary{display:grid;grid-template-columns:140px 1fr;gap:7px 12px;margin:18px 0;padding:13px;background:#0b1422;border:1px solid #26364c;border-radius:10px}.summary b{color:#9fb0c4}.variants,.times{display:flex;flex-wrap:wrap;gap:8px}.variants button,.times button,.primary{border:1px solid #3a4d66;background:#142236;color:#e7eef7;padding:9px 12px;border-radius:9px;cursor:pointer}.variants button.active,.times button.sel,.primary{background:#1476b8;border-color:#2790d2;color:#fff;font-weight:700}.months{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:16px}.month h3{text-align:center}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.dow{text-align:center;font-size:11px;color:#8799ae;font-weight:700}.day{min-height:38px;border:1px solid transparent;border-radius:7px;background:transparent;color:#52657b}.day.avail{border-color:#3a4d66;background:#111b2b;color:#e7eef7;cursor:pointer}.day.sel{background:#1476b8;color:#fff}.notice{margin-top:16px;padding:12px;border-radius:10px;background:#132338;border:1px solid #31516f}.error{background:#3a171c;border-color:#7e3540;color:#ffd5da}.success{background:#123322;border-color:#2e7652;color:#d1f7df}.hidden{display:none}@media(max-width:700px){.months{grid-template-columns:1fr}.summary{grid-template-columns:1fr}.summary b{margin-top:5px}}
</style>
</head>
<body><main><section class="card"><h1>Schedule your Maxim CPR training</h1><div class="muted">Choose an eligible 910CPR class before your current certification expires. Maxim is billed directly.</div><div id="state" class="notice">Loading your secure scheduling link…</div><div id="app" class="hidden"><div id="summary" class="summary"></div><div class="variants" id="variants"></div><div class="months" id="months"></div><h3 id="selectedLabel">Choose a date</h3><div class="times" id="times"></div><div id="result" class="notice hidden"></div></div></section></main>
<script>
const API='https://wktwgcnwdvbebcobgyey.supabase.co/functions/v1/maxim-scheduler';
const token=new URLSearchParams(location.search).get('token')||'';
let person=null,selector='',payload=null,courseId='',selectedDate='',selectedSlot='';
const configs={bls:[['BLS Initial','209806'],['BLS Renewal','359474'],['BLS HeartCode','210549']],heartsaver:[['Heartsaver In Person','209809'],['Online + Skills','329495']]};
function esc(v){return String(v||'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]))}
function fmt(v){const m=String(v||'').match(/^(\d{4})-(\d{2})-(\d{2})/);return m?`${m[2]}/${m[3]}/${m[1]}`:String(v||'')}
function slotKey(c){return [c.courseId,c.date,c.startTime,c.appointmentDayId||'',c.availabilityBlockId||''].join('|')}
async function boot(){
 const r=await fetch(API+'/link?token='+encodeURIComponent(token),{cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok){state.textContent=d.error||'This link is not available.';state.classList.add('error');return}
 person=d.employee;selector=d.selectors[0];state.classList.add('hidden');app.classList.remove('hidden');summary.innerHTML=`<b>Participant</b><span>${esc(person.firstName)} ${esc(person.lastName)}</span><b>Training</b><span>${esc(person.course)}</span><b>Renew by</b><span>${esc(fmt(person.expirationDate))}</span><b>Billing</b><span>Maxim ${esc(person.billingAccount)}</span>`;
 variants.innerHTML=configs[selector].map((x,i)=>`<button class="${i===0?'active':''}" data-course="${x[1]}">${x[0]}</button>`).join('');courseId=configs[selector][0][1];variants.onclick=e=>{const b=e.target.closest('[data-course]');if(!b)return;document.querySelectorAll('#variants button').forEach(x=>x.classList.toggle('active',x===b));courseId=b.dataset.course;renderCalendar()};
 const a=await fetch(`/data/block-selector-availability/${selector}.json?maxim=${Date.now()}`,{cache:'no-store'});payload=await a.json();renderCalendar();
}
function eligibleRows(){const out={};for(const day of (payload?.dates||[])){if(day.date>String(person.expirationDate).slice(0,10))continue;for(const s of (day.startTimes||[])){for(const c of (s.courses||[])){if(String(c.courseId)!==String(courseId))continue;(out[day.date]??=[]).push({...c,date:day.date,startTime:s.startTime,displayStartTime:s.displayStartTime,displayDate:day.displayDate})}}}return out}
function renderCalendar(){const rows=eligibleRows(),keys=Object.keys(rows).sort();months.innerHTML='';times.innerHTML='';selectedLabel.textContent='Choose a date';selectedDate='';selectedSlot='';if(!keys.length){months.innerHTML='<div class="notice error">No eligible times are currently available before your renewal deadline. Please contact 910CPR or your Maxim office.</div>';return}for(const ym of [...new Set(keys.map(k=>k.slice(0,7)))].slice(0,2)){const [y,m]=ym.split('-').map(Number),first=new Date(y,m-1,1),last=new Date(y,m,0).getDate();let h=`<div class="month"><h3>${first.toLocaleDateString('en-US',{month:'long',year:'numeric'})}</h3><div class="grid">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="dow">${x}</div>`).join('')}`;for(let i=0;i<first.getDay();i++)h+='<div></div>';for(let n=1;n<=last;n++){const k=`${y}-${String(m).padStart(2,'0')}-${String(n).padStart(2,'0')}`,ok=rows[k]?.length;h+=`<button class="day${ok?' avail':''}" ${ok?`data-date="${k}"`:'disabled'}>${n}</button>`}h+='</div></div>';months.insertAdjacentHTML('beforeend',h)}
 months.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>chooseDate(b.dataset.date,b));
}
function chooseDate(date,b){selectedDate=date;document.querySelectorAll('.day').forEach(x=>x.classList.toggle('sel',x===b));const rows=eligibleRows()[date]||[];selectedLabel.textContent='Selected: '+(rows[0]?.displayDate||fmt(date));times.innerHTML=rows.map(r=>`<button data-slot="${esc(slotKey(r))}" data-start="${esc(r.startTime)}">${esc(r.displayStartTime||r.startTime)}</button>`).join('');times.querySelectorAll('button').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('#times button').forEach(x=>x.classList.remove('sel'));btn.classList.add('sel');selectedSlot=btn.dataset.slot;submit(btn.dataset.start,btn)})}
async function submit(start,btn){if(!selectedSlot)return;const old=btn.textContent;btn.disabled=true;btn.textContent='Scheduling…';result.className='notice hidden';const r=await fetch(API+'/register',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token,courseId,date:selectedDate,startTime:start,slotKey:selectedSlot})});const d=await r.json().catch(()=>({}));if(!r.ok){result.className='notice error';result.textContent=d.error||'Could not schedule this class.';btn.disabled=false;btn.textContent=old;return}result.className='notice success';result.textContent=`✓ Scheduled for ${fmt(d.date)} at ${d.displayStartTime||d.startTime}.`+(d.emailWarning?' Your class is saved, but the confirmation email could not be sent: '+d.emailWarning:' A confirmation email has been sent.');document.querySelectorAll('#variants button,#months button,#times button').forEach(x=>x.disabled=true)}
boot().catch(e=>{state.textContent='Could not load this scheduling link: '+e.message;state.classList.add('error')});
</script></body></html>
