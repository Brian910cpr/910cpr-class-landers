:root{--navy:#13263a;--red:#d64045;--blue:#1677a8;--ink:#172133;--muted:#687386;--line:#d9e0e8;--soft:#f5f8fa}*{box-sizing:border-box}body{margin:0;background:var(--soft);color:var(--ink);font:15px/1.45 Arial,Helvetica,sans-serif}.top{height:8px;background:linear-gradient(90deg,var(--red),#ef8b45,var(--blue))}main{max-width:760px;margin:auto;padding:28px 14px 48px}.brand{display:flex;align-items:center;gap:10px;margin:0 0 16px;font-weight:900;font-size:21px}.brand img{width:48px;height:48px;object-fit:contain}.brand span{display:block;color:var(--muted);font-size:12px;font-weight:600}.shell{overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 16px 40px rgba(19,38,58,.09)}.session{padding:24px;background:var(--navy);color:#fff}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.1em;opacity:.78;font-weight:800}.session h1{margin:5px 0 15px;font-size:clamp(25px,6vw,36px);line-height:1.08}.facts{display:grid;gap:9px}.fact{display:flex;gap:9px}.price{margin-top:13px;font-size:22px;font-weight:900}.formwrap{padding:24px}.formwrap h2{margin:0 0 4px;font-size:23px}.intro{margin:0 0 18px;color:var(--muted)}form,.student-fields{display:grid;grid-template-columns:1fr 1fr;gap:13px}label{display:grid;gap:5px;font-weight:800;font-size:13px}.wide{grid-column:1/-1}input{width:100%;border:1px solid #b8c4ce;border-radius:10px;padding:12px 13px;font:inherit;color:var(--ink);background:#fff}input:focus{outline:3px solid rgba(22,119,168,.18);border-color:var(--blue)}button{grid-column:1/-1;border:0;border-radius:11px;padding:14px 18px;background:var(--red);color:#fff;font:800 16px/1.2 inherit;cursor:pointer}button.secondary{background:#e9eef3;color:var(--navy)}button.remove{grid-column:auto;background:transparent;color:#9c2328;padding:4px 8px}button:disabled{opacity:.65;cursor:wait}.student{grid-column:1/-1;border:1px solid var(--line);border-radius:13px;padding:16px;background:#fbfcfd}.student-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.addons{grid-column:1/-1;display:grid;gap:8px}.addon{display:flex;align-items:flex-start;gap:9px;padding:10px;border:1px solid var(--line);border-radius:9px}.addon input{width:auto;margin-top:3px}.fine,.status{grid-column:1/-1;margin:0}.fine{color:var(--muted);font-size:12px}.status{color:#9c2328}.status:empty{display:none}.status.ok{padding:13px;border-radius:10px;background:#e9f8ef;color:#18603b}.loading,.errorbox{padding:42px 24px;text-align:center}.errorbox{color:#8b2025;background:#fff5f5}@media(max-width:560px){main{padding-top:18px}.session,.formwrap{padding:20px}form,.student-fields{grid-template-columns:1fr}label,.wide{grid-column:1}}
html[data-theme="dark"] .shell{background:#111a27!important;border-color:#39495d!important;box-shadow:0 16px 40px rgb(0 0 0 / 30%)}html[data-theme="dark"] .formwrap{background:#111a27!important;color:#e8eef6!important}html[data-theme="dark"] .formwrap h2,html[data-theme="dark"] .formwrap label,html[data-theme="dark"] .student-head{color:#f5f8fc!important}html[data-theme="dark"] .intro,html[data-theme="dark"] .fine{color:#b9c6d5!important}html[data-theme="dark"] .student{background:#172435!important;border-color:#39495d!important;color:#e8eef6!important}html[data-theme="dark"] .formwrap input{background:#fff!important;color:#172133!important;border-color:#91a4b7!important}html[data-theme="dark"] .formwrap input:focus{border-color:#69b9ee!important;outline-color:rgb(105 185 238 / 30%)!important}html[data-theme="dark"] button.secondary{background:#25384d!important;color:#eef5fc!important;border:1px solid #58718b!important}html[data-theme="dark"] .session{background:#13263a!important}
.student-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,.8fr);gap:18px;align-items:start}.student-details,.student-options{min-width:0}.student-options{display:grid;gap:10px;padding-left:18px;border-left:1px solid var(--line)}.addons{margin:0;padding:0;border:0}.addons legend{font-weight:800;font-size:13px;margin:0 0 7px}.addon small{display:block;margin-top:2px;color:var(--muted);font-weight:400}.manual-check,.same-for-all{grid-template-columns:auto 1fr;align-items:start}.manual-check input,.same-for-all input{width:auto;margin-top:3px}.same-for-all{padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--soft)}.student-total,.order-total{margin:0;font-weight:800}.order-total{padding:12px 14px;background:var(--soft);border:1px solid var(--line);border-radius:10px}.billing-suggestions{display:grid;gap:4px;margin-top:-8px;padding:6px;border:1px solid var(--line);border-radius:10px;background:#fff}.billing-suggestions button{padding:8px 10px;text-align:left;background:#fff;color:var(--navy);border:1px solid transparent;border-radius:7px;font-size:14px}.billing-suggestions button:hover{background:var(--soft);border-color:var(--line)}.billing-help{margin:-8px 0 0;color:var(--muted);font-size:12px}html[data-theme="dark"] .student-options{border-color:#39495d}html[data-theme="dark"] .order-total,html[data-theme="dark"] .same-for-all,html[data-theme="dark"] .billing-suggestions{background:#172435!important;border-color:#39495d!important;color:#e8eef6!important}html[data-theme="dark"] .billing-suggestions button{background:#172435!important;color:#eef5fc!important;border-color:#39495d!important}html[data-theme="dark"] .addon small,html[data-theme="dark"] .billing-help{color:#b9c6d5!important}@media(max-width:560px){.student-body{grid-template-columns:1fr}.student-options{padding-left:0;padding-top:16px;border-left:0;border-top:1px solid var(--line)}}
</style>

<div class="top"></div><main>
<div class="brand"><img src="/images/logo.png" alt="910CPR"><div>910CPR<span>Coastal CPR Training</span></div></div>
<section class="shell" id="app"><div class="loading">Loading your class…</div></section>
</main>
<script>
const API='https://wktwgcnwdvbebcobgyey.supabase.co/functions/v1/public-registration',app=document.getElementById('app'),params=new URLSearchParams(location.search),sessionId=params.get('session')||'';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=value=>value===null||value===''||value===undefined?'':new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(value));
function when(startValue,endValue){const start=new Date(startValue),end=endValue?new Date(endValue):null,opts={timeZone:'America/New_York'};return{date:new Intl.DateTimeFormat('en-US',{...opts,weekday:'long',month:'long',day:'numeric',year:'numeric'}).format(start),time:new Intl.DateTimeFormat('en-US',{...opts,hour:'numeric',minute:'2-digit'}).format(start)+(end?'–'+new Intl.DateTimeFormat('en-US',{...opts,hour:'numeric',minute:'2-digit'}).format(end):'')}}
const COMPANY_BILLING_CODES=[{code:'assistedcare',company:'AssistedCare',aliases:['assisted care']},{code:'Breakthrough',company:'Breakthrough Autism',aliases:['breakthrough']},{code:'Maxim',company:'Maxim Homecare',aliases:['maxim home care','homecare']},{code:'MaximBH',company:'Maxim Behavioral Health',aliases:['maxim bh','behavioral health','aba']},{code:'MaximDSP',company:'Maxim Direct Support Professionals',aliases:['maxim dsp','direct support','idd']}];
const addonHtml=(addons,index)=>(addons||[]).map(a=>`<label class="addon" data-amount="${Number(a.unit_amount||0)/100}"><input type="checkbox" data-addon="${esc(a.key)}" data-student="${index}"><span><strong>${esc(a.display_name||a.name||a.key)}</strong> <b>+${money(Number(a.unit_amount||0)/100)}</b>${a.description?`<small>${esc(a.description)}</small>`:''}</span></label>`).join('');
function studentHtml(index,session){const manual=String(session.courseId)==='209806'?'<label class="manual-check"><input type="checkbox" data-manual-required required><span>I have the current AHA BLS Provider Manual, or I will add the eBook.</span></label>':'';const same=index===0?'<label class="same-for-all"><input type="checkbox" data-same-for-all><span>Apply these add-ons and this billing code to all students.</span></label>':'';const options=session.addons?.length?`<fieldset class="addons"><legend>Add-ons for this student</legend>${addonHtml(session.addons,index)}</fieldset>`:'';return`<section class="student" data-student-card="${index}"><div class="student-head"><strong>Student ${index+1}</strong>${index?'<button class="remove" type="button">Remove</button>':''}</div><div class="student-body"><div class="student-details"><div class="student-fields"><label>First name<input data-field="firstName" autocomplete="given-name" maxlength="100" required></label><label>Last name<input data-field="lastName" autocomplete="family-name" maxlength="100" required></label><label class="wide">Email<input data-field="email" type="email" autocomplete="email" maxlength="320" required></label><label class="wide">Mobile phone<input data-field="phone" type="tel" autocomplete="tel" inputmode="tel" maxlength="50" required></label>${manual}</div></div><aside class="student-options">${options}<label>Promo or billing code (optional)<input data-billing-code maxlength="80" autocomplete="off" placeholder="Company name or billing code" role="combobox" aria-autocomplete="list" aria-expanded="false"></label><div class="billing-suggestions" data-billing-suggestions role="listbox" hidden></div><p class="billing-help" data-billing-help>Start with three characters to see a participating company.</p>${same}<p class="student-total" data-student-total>Student total: ${money(session.price)}</p></aside></div></section>`}
async function load(){const recover=params.get('recover'),order=params.get('order');if(order&&params.get('paid')){const r=await fetch(`${API}/order/${encodeURIComponent(order)}`,{cache:'no-store'}),p=await r.json();if(!r.ok||!p.ok)throw Error('Payment is still processing. Refresh this page in a moment.');app.innerHTML='<div class="loading"><h2>Registration confirmed</h2><p>Your payment was received and the student seat is confirmed. Confirmation email is on the way.</p></div>';return}if(recover){const r=await fetch(`${API}/recover/${encodeURIComponent(recover)}`,{cache:'no-store'}),p=await r.json();if(p.status==='paid'){app.innerHTML='<div class="loading"><h2>Registration confirmed</h2><p>This order is already paid.</p></div>';return}if(r.ok&&p.checkoutUrl){location.assign(p.checkoutUrl);return}if(p.status==='expired'&&p.sessionId){location.assign(`/register/?session=${encodeURIComponent(p.sessionId)}`);return}throw Error('This recovery link is unavailable.')}if(!/^\d+$/.test(sessionId))throw Error('Choose a class from the 910CPR schedule to begin.');const r=await fetch(`${API}/session/${encodeURIComponent(sessionId)}`,{cache:'no-store'}),p=await r.json();if(!r.ok||!p.ok)throw Error(p.error==='price_catalog_missing'?'This class price is being synchronized. Please call 910-395-5193.':'This class is not currently available for registration.');render(p.session)}
 function render(session){const time=when(session.startsAt,session.endsAt),storageKey=`registrationOrder:${sessionId}`,key=sessionStorage.getItem(storageKey)||crypto.randomUUID();sessionStorage.setItem(storageKey,key);app.innerHTML=`<div class="session"><div class="eyebrow">Your selected class</div><h1>${esc(session.course)}</h1><div class="facts"><div class="fact"><span>●</span><div><strong>${esc(time.date)}</strong><br>${esc(time.time)}</div></div><div class="fact"><span>◆</span><div><strong>${esc(session.location)}</strong></div></div></div><div class="price">${money(session.price)} per student</div></div><div class="formwrap"><h2>Who is attending?</h2><p class="intro">Add every student, then choose add-ons and a billing code for each person.</p><form id="registration"><div id="students" class="wide">${studentHtml(0,session)}</div><button class="secondary" id="add-student" type="button">Add another student</button><div class="order-total wide" aria-live="polite">Order total before any billing-code adjustment: <strong id="order-total">${money(session.price)}</strong></div><button id="continue">Hold seats and pay securely</button><p class="fine">Seats are held for 30 minutes. The final total is calculated securely before Stripe Checkout.</p><p class="status" id="status" role="status" aria-live="polite"></p></form></div>`;const form=document.getElementById('registration'),students=document.getElementById('students'),button=document.getElementById('continue'),status=document.getElementById('status');let count=1;
 const entries=()=>[...students.querySelectorAll('.student')].map(card=>{const value=n=>card.querySelector(`[data-field="${n}"]`).value.trim();return{firstName:value('firstName'),lastName:value('lastName'),email:value('email'),phone:value('phone'),billingCode:card.querySelector('[data-billing-code]').value.trim(),addons:[...card.querySelectorAll('[data-addon]:checked')].map(x=>({key:x.dataset.addon,quantity:1}))}});
 function updateTotals(){let total=0;[...students.querySelectorAll('.student')].forEach(card=>{const amount=Number(session.price||0)+[...card.querySelectorAll('[data-addon]:checked')].reduce((sum,input)=>sum+Number(input.closest('.addon').dataset.amount||0),0);card.querySelector('[data-student-total]').textContent=`Student total: ${money(amount)}`;total+=amount});document.getElementById('order-total').textContent=money(total)}
 function copyFirstToAll(){const first=students.firstElementChild,code=first.querySelector('[data-billing-code]').value,keys=[...first.querySelectorAll('[data-addon]:checked')].map(input=>input.dataset.addon);[...students.children].slice(1).forEach(card=>{card.querySelector('[data-billing-code]').value=code;card.querySelectorAll('[data-addon]').forEach(input=>{input.checked=keys.includes(input.dataset.addon)});const manual=card.querySelector('[data-manual-required]');if(manual&&keys.length)manual.checked=true});updateTotals()}
 function bindStudent(card){const billing=card.querySelector('[data-billing-code]'),suggestions=card.querySelector('[data-billing-suggestions]'),help=card.querySelector('[data-billing-help]');const close=()=>{suggestions.hidden=true;suggestions.replaceChildren();billing.setAttribute('aria-expanded','false')};const select=item=>{billing.value=item.code;help.textContent=`${item.company} selected.`;close();if(students.firstElementChild.querySelector('[data-same-for-all]')?.checked)copyFirstToAll()};const suggest=()=>{const query=billing.value.trim().toLowerCase();if(query.length<3)return close();const matches=COMPANY_BILLING_CODES.filter(item=>[item.company,item.code,...item.aliases].some(value=>value.toLowerCase().includes(query)));if(!matches.length)return close();suggestions.replaceChildren(...matches.map(item=>{const option=document.createElement('button');option.type='button';option.setAttribute('role','option');option.textContent=item.company;option.onclick=()=>select(item);return option}));suggestions.hidden=false;billing.setAttribute('aria-expanded','true')};billing.addEventListener('input',suggest);billing.addEventListener('keydown',event=>{if(event.key==='Escape')close();if(event.key==='Enter'&&!suggestions.hidden&&suggestions.firstElementChild){event.preventDefault();suggestions.firstElementChild.click()}});billing.addEventListener('blur',()=>setTimeout(close,120));card.querySelectorAll('[data-addon]').forEach(input=>input.addEventListener('change',()=>{const manual=card.querySelector('[data-manual-required]');if(manual&&input.checked)manual.checked=true;updateTotals();if(card===students.firstElementChild&&card.querySelector('[data-same-for-all]')?.checked)copyFirstToAll()}));card.querySelector('[data-manual-required]')?.addEventListener('change',updateTotals)}
 function bindRemovers(){students.querySelectorAll('.remove').forEach(b=>b.onclick=()=>{b.closest('.student').remove();updateTotals()})}document.getElementById('add-student').onclick=()=>{if(count>=10)return;students.insertAdjacentHTML('beforeend',studentHtml(count++,session));const card=students.lastElementChild;bindStudent(card);bindRemovers();if(students.firstElementChild.querySelector('[data-same-for-all]')?.checked)copyFirstToAll();updateTotals()};[...students.children].forEach(bindStudent);students.firstElementChild.querySelector('[data-same-for-all]').addEventListener('change',event=>{if(event.target.checked)copyFirstToAll()});updateTotals();form.addEventListener('submit',async e=>{e.preventDefault();if(!form.reportValidity())return;button.disabled=true;status.className='status';status.textContent='Holding your seats and opening payment…';try{const order=entries(),r=await fetch(`${API}/start`,{method:'POST',headers:{'content-type':'application/json','idempotency-key':key},body:JSON.stringify({sessionId,students:order,payerEmail:order[0].email,payerPhone:order[0].phone})}),p=await r.json();if(!r.ok||!p.ok)throw Error(p.error||'registration_failed');sessionStorage.removeItem(storageKey);status.className='status ok';status.textContent='Seats held. Opening Stripe checkout…';location.assign(p.checkoutUrl)}catch(err){const messages={invalid_billing_code:'That promo or billing code is not valid for this class.',insufficient_seats:'There are not enough seats remaining for this order.',price_catalog_missing:'This class price has not finished synchronizing.',invalid_addon:'One of the selected options is no longer available.'};status.textContent=messages[err.message]||'We could not start checkout. Your information is still on this page; please try again.';button.disabled=false}})}
load().catch(error=>app.innerHTML=`<div class="errorbox"><strong>Registration unavailable</strong><p>${esc(error.message)}</p><a href="/classes/">View available classes</a></div>`);
</script></body></html>
