<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Start your registration | 910CPR</title>
  <meta name="description" content="Start your 910CPR class registration, then continue to secure checkout.">
  <style>
    :root{--navy:#102a43;--blue:#1677a8;--sky:#eaf7fb;--red:#d64045;--ink:#263746;--muted:#627586;--line:#d9e3ea;--white:#fff;--shadow:0 18px 55px rgba(16,42,67,.12)}
    *{box-sizing:border-box}body{margin:0;background:linear-gradient(150deg,#f7fbfd 0,#edf7fa 55%,#f8fafc 100%);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
    .top{height:8px;background:linear-gradient(90deg,var(--blue),#54bdd0 72%,var(--red) 72%)}
    main{width:min(100% - 28px,680px);margin:0 auto;padding:28px 0 56px}.brand{display:flex;align-items:center;gap:12px;margin-bottom:24px;color:var(--navy);font-weight:800;font-size:20px}.brand img{width:52px;height:52px;object-fit:contain}.brand span{display:block;color:var(--muted);font-size:12px;font-weight:650;letter-spacing:.06em;text-transform:uppercase}
    .shell{background:var(--white);border:1px solid rgba(217,227,234,.9);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}.session{padding:24px;background:var(--navy);color:white}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:#99d8e6;font-weight:800;margin-bottom:7px}.session h1{font-size:clamp(24px,6vw,34px);line-height:1.12;margin:0 0 18px}.facts{display:grid;gap:9px}.fact{display:grid;grid-template-columns:22px 1fr;gap:8px;color:#e8f1f6}.fact strong{color:white}.price{margin-top:14px;font-size:22px;font-weight:800}.price:empty{display:none}
    .formwrap{padding:24px}.formwrap h2{color:var(--navy);font-size:24px;margin:0 0 6px}.intro{margin:0 0 22px;color:var(--muted)}form{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:grid;gap:6px;color:var(--navy);font-size:14px;font-weight:750}.wide{grid-column:1/-1}input{width:100%;border:1px solid #b7c7d4;border-radius:10px;padding:12px 13px;font:inherit;color:var(--ink);background:#fff}input:focus{outline:3px solid rgba(22,119,168,.18);border-color:var(--blue)}button{grid-column:1/-1;margin-top:4px;border:0;border-radius:12px;padding:14px 18px;background:var(--red);color:white;font:800 16px/1.2 inherit;cursor:pointer;box-shadow:0 8px 20px rgba(214,64,69,.22)}button:hover{background:#bc3439}button:disabled{opacity:.65;cursor:wait}.fine{grid-column:1/-1;margin:0;color:var(--muted);font-size:12px}.status{grid-column:1/-1;margin:0;border-radius:10px;padding:0;color:#a32329}.status:empty{display:none}.status.ok{padding:13px;background:#e9f8ef;color:#18603b}.loading{padding:44px 24px;text-align:center;color:var(--muted)}.errorbox{padding:28px;color:#8b2025;background:#fff5f5}.diagnostics{margin-top:18px;text-align:center;color:#7a8995;font-size:11px}
    @media(max-width:560px){main{padding-top:18px}.brand{margin-left:4px}.session,.formwrap{padding:21px}form{grid-template-columns:1fr}label,.wide{grid-column:1}.shell{border-radius:17px}}
  </style>
</head>
<body><div class="top"></div><main>
  <div class="brand"><img src="/images/logo.png" alt="910CPR"><div>910CPR<span>Coastal CPR Training</span></div></div>
  <section class="shell" id="app"><div class="loading">Loading your class…</div></section>
  <div class="diagnostics" data-page-id="public-registration-front-door" data-build-id="source-20260903" data-asset-version="register-inline-v1">Registration page · 910CPR</div>
</main>
<script>
const API='https://wktwgcnwdvbebcobgyey.supabase.co/functions/v1/landerware-registration',app=document.getElementById('app'),sessionId=new URLSearchParams(location.search).get('session')||'';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function money(value){if(value===null||value===''||value===undefined)return'';const n=Number(String(value).replace(/[^0-9.-]/g,''));return Number.isFinite(n)?new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n):esc(value)}
function dateParts(value,end){const start=new Date(value),finish=end?new Date(end):null;if(Number.isNaN(start.valueOf()))return{date:'Date available at checkout',time:''};return{date:new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric',timeZone:'America/New_York'}).format(start),time:new Intl.DateTimeFormat('en-US',{hour:'numeric',minute:'2-digit',timeZone:'America/New_York'}).format(start)+(finish?'–'+new Intl.DateTimeFormat('en-US',{hour:'numeric',minute:'2-digit',timeZone:'America/New_York'}).format(finish):'')}}
async function load(){if(!/^\d+$/.test(sessionId))throw Error('Choose a class from the 910CPR schedule to start registration.');let session;try{const r=await fetch(`${API}/public-session/${encodeURIComponent(sessionId)}`,{cache:'no-store'}),j=await r.json();if(r.ok&&j.ok)session=j.session}catch{}if(!session){const r=await fetch('/data/schedule_future.json',{cache:'no-store'}),j=await r.json(),rows=Array.isArray(j)?j:j.sessions||[],s=rows.find(x=>String(x.session_id)===sessionId&&x.public_direct_booking===true&&x.registration_status==='open');if(s)session={id:s.session_id,courseId:s.course_id,course:s.course_name,dateTime:s.start_at,endsAt:s.end_at||null,location:s.location_display||s.location_name||'',price:s.price??s.mapped_price??null}}if(!session)throw Error('This class is not currently available for registration.');render(session)}
function render(s){const when=dateParts(s.dateTime,s.endsAt),locationText=String(s.location||'').replace(/^::\s*/,'').replace(/;\s*/g,', '),keyName=`registrationIntent:${sessionId}`,key=sessionStorage.getItem(keyName)||crypto.randomUUID();sessionStorage.setItem(keyName,key);app.innerHTML=`<div class="session"><div class="eyebrow">Your selected class</div><h1>${esc(s.course)}</h1><div class="facts"><div class="fact"><span aria-hidden="true">●</span><div><strong>${esc(when.date)}</strong><br>${esc(when.time)}</div></div><div class="fact"><span aria-hidden="true">◆</span><div><strong>${esc(locationText)}</strong></div></div></div><div class="price">${money(s.price)}</div></div><div class="formwrap"><h2>Start your registration</h2><p class="intro">Tell us who is attending. You’ll choose options and complete secure checkout next.</p><form id="registration"><label>First name *<input name="firstName" autocomplete="given-name" maxlength="100" required></label><label>Last name *<input name="lastName" autocomplete="family-name" maxlength="100" required></label><label class="wide">Email *<input name="email" type="email" autocomplete="email" maxlength="320" required></label><label class="wide">Mobile phone *<input name="phone" type="tel" autocomplete="tel" inputmode="tel" maxlength="50" required></label><button id="continue">Continue Registration</button><p class="fine">Next, you’ll continue to secure checkout to select any available course options and pay.</p><p class="status" id="status" role="status" aria-live="polite"></p></form></div>`;const form=document.getElementById('registration'),button=document.getElementById('continue'),status=document.getElementById('status');form.addEventListener('submit',async e=>{e.preventDefault();if(!form.reportValidity())return;button.disabled=true;status.className='status';status.textContent='Saving your registration…';const body=Object.fromEntries(new FormData(form));body.sessionId=sessionId;try{const r=await fetch(`${API}/start-external`,{method:'POST',headers:{'content-type':'application/json','idempotency-key':key},body:JSON.stringify(body)}),j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'Could not continue registration.');sessionStorage.removeItem(keyName);status.className='status ok';status.innerHTML=`<strong>Thanks, ${esc(j.firstName)}.</strong> Continue to secure checkout.`;button.textContent='Opening secure checkout…';setTimeout(()=>location.assign(j.handoff.url),700)}catch(error){status.className='status';status.textContent=error.message==='invalid_phone'?'Enter a valid mobile phone number.':'We could not save your registration. Please try again.';button.disabled=false;button.textContent='Continue Registration'}})}
load().catch(error=>app.innerHTML=`<div class="errorbox"><strong>Registration unavailable</strong><p>${esc(error.message)}</p><a href="/">View available classes</a></div>`);
</script></body></html>
