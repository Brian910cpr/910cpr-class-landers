<style>
:root{--navy:#13263a;--red:#d64045;--blue:#1677a8;--ink:#172133;--muted:#687386;--line:#d9e0e8;--soft:#f5f8fa}*{box-sizing:border-box}body{margin:0;background:var(--soft);color:var(--ink);font:15px/1.45 Arial,Helvetica,sans-serif}.top{height:8px;background:linear-gradient(90deg,var(--red),#ef8b45,var(--blue))}main{max-width:720px;margin:auto;padding:28px 14px 48px}.brand{display:flex;align-items:center;gap:10px;margin:0 0 16px;font-weight:900;font-size:21px}.brand img{width:48px;height:48px;object-fit:contain}.brand span{display:block;color:var(--muted);font-size:12px;font-weight:600}.shell{overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 16px 40px rgba(19,38,58,.09)}.session{padding:24px;background:var(--navy);color:#fff}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.1em;opacity:.78;font-weight:800}.session h1{margin:5px 0 15px;font-size:clamp(25px,6vw,36px);line-height:1.08}.facts{display:grid;gap:9px}.fact{display:flex;gap:9px}.price{margin-top:13px;font-size:22px;font-weight:900}.formwrap{padding:24px}.formwrap h2{margin:0 0 4px;font-size:23px}.intro{margin:0 0 18px;color:var(--muted)}form{display:grid;grid-template-columns:1fr 1fr;gap:13px}label{display:grid;gap:5px;font-weight:800;font-size:13px}.wide{grid-column:1/-1}input{width:100%;border:1px solid #b8c4ce;border-radius:10px;padding:12px 13px;font:inherit;color:var(--ink);background:#fff}input:focus{outline:3px solid rgba(22,119,168,.18);border-color:var(--blue)}button{grid-column:1/-1;border:0;border-radius:11px;padding:14px 18px;background:var(--red);color:#fff;font:800 16px/1.2 inherit;cursor:pointer}button:disabled{opacity:.65;cursor:wait}.fine,.status{grid-column:1/-1;margin:0}.fine{color:var(--muted);font-size:12px}.status{color:#9c2328}.status:empty{display:none}.status.ok{padding:13px;border-radius:10px;background:#e9f8ef;color:#18603b}.loading,.errorbox{padding:42px 24px;text-align:center}.errorbox{color:#8b2025;background:#fff5f5}@media(max-width:560px){main{padding-top:18px}.session,.formwrap{padding:20px}form{grid-template-columns:1fr}label,.wide{grid-column:1}}
</style>

<div class="top"></div><main>
<div class="brand"><img src="/images/logo.png" alt="910CPR"><div>910CPR<span>Coastal CPR Training</span></div></div>
<section class="shell" id="app"><div class="loading">Loading your class…</div></section>
</main>
<script>
const API='https://wktwgcnwdvbebcobgyey.supabase.co/functions/v1/public-registration',app=document.getElementById('app'),sessionId=new URLSearchParams(location.search).get('session')||'';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=value=>value===null||value===''||value===undefined?'':new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(value));
function when(startValue,endValue){const start=new Date(startValue),end=endValue?new Date(endValue):null,opts={timeZone:'America/New_York'};return{date:new Intl.DateTimeFormat('en-US',{...opts,weekday:'long',month:'long',day:'numeric',year:'numeric'}).format(start),time:new Intl.DateTimeFormat('en-US',{...opts,hour:'numeric',minute:'2-digit'}).format(start)+(end?'–'+new Intl.DateTimeFormat('en-US',{...opts,hour:'numeric',minute:'2-digit'}).format(end):'')}}
async function load(){if(!/^\d+$/.test(sessionId))throw Error('Choose a class from the 910CPR schedule to begin.');const response=await fetch(`${API}/session/${encodeURIComponent(sessionId)}`,{cache:'no-store'}),payload=await response.json();if(!response.ok||!payload.ok)throw Error('This class is not currently available for registration.');render(payload.session)}
function render(session){const time=when(session.startsAt,session.endsAt),storageKey=`registrationIntent:${sessionId}`,idempotencyKey=sessionStorage.getItem(storageKey)||crypto.randomUUID();sessionStorage.setItem(storageKey,idempotencyKey);app.innerHTML=`<div class="session"><div class="eyebrow">Your selected class</div><h1>${esc(session.course)}</h1><div class="facts"><div class="fact"><span>●</span><div><strong>${esc(time.date)}</strong><br>${esc(time.time)}</div></div><div class="fact"><span>◆</span><div><strong>${esc(session.location)}</strong></div></div></div><div class="price">${money(session.price)}</div></div><div class="formwrap"><h2>Who is attending?</h2><p class="intro">Enter the student’s information. You’ll continue to secure checkout next.</p><form id="registration"><label>First name<input name="firstName" autocomplete="given-name" maxlength="100" required></label><label>Last name<input name="lastName" autocomplete="family-name" maxlength="100" required></label><label class="wide">Email<input name="email" type="email" autocomplete="email" maxlength="320" required></label><label class="wide">Mobile phone<input name="phone" type="tel" autocomplete="tel" inputmode="tel" maxlength="50" required></label><button id="continue">Continue to secure checkout</button><p class="fine">Your seat is held while you complete payment. If checkout is interrupted, return here to reopen it.</p><p class="status" id="status" role="status" aria-live="polite"></p></form></div>`;const form=document.getElementById('registration'),button=document.getElementById('continue'),status=document.getElementById('status');form.addEventListener('submit',async event=>{event.preventDefault();if(!form.reportValidity())return;button.disabled=true;status.className='status';status.textContent='Holding your seat…';const body=Object.fromEntries(new FormData(form));body.sessionId=sessionId;try{const response=await fetch(`${API}/start`,{method:'POST',headers:{'content-type':'application/json','idempotency-key':idempotencyKey},body:JSON.stringify(body)}),payload=await response.json();if(!response.ok||!payload.ok)throw Error(payload.error||'registration_failed');status.className='status ok';status.innerHTML=`<strong>Thanks, ${esc(payload.firstName)}.</strong> Opening secure checkout…`;setTimeout(()=>location.assign(payload.handoff.url),500)}catch(error){if(session.fallbackRegistrationUrl){status.className='status ok';status.innerHTML='<strong>Opening the secure registration checkout…</strong>';setTimeout(()=>location.assign(session.fallbackRegistrationUrl),500);return}status.textContent=error.message==='invalid_phone'?'Enter a valid 10-digit phone number.':error.message==='session_full'?'That class just filled. Please choose another time.':'We could not save your registration. Please try again.';button.disabled=false}})}
load().catch(error=>app.innerHTML=`<div class="errorbox"><strong>Registration unavailable</strong><p>${esc(error.message)}</p><a href="/classes/">View available classes</a></div>`);
</script></body></html>
