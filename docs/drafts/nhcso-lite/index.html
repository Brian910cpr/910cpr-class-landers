<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NHCSO Training Portal Draft</title><style>
:root{--bg:#0b1220;--panel:#111827;--panel2:#0d1626;--line:#334155;--text:#f8fafc;--muted:#9fb0c7;--accent:#3b82f6;--good:#22c55e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Segoe UI,Arial,sans-serif}.top{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center;justify-content:space-between;position:sticky;top:0;background:#08101d;z-index:10}.brand h1{margin:0;font-size:22px}.brand div{font-size:12px;color:var(--muted);margin-top:3px}.shell{padding:20px;max-width:1180px;margin:auto}.summary{display:grid;grid-template-columns:minmax(0,1fr) 180px;gap:14px;margin-bottom:16px}.searchbox,.counter,.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px}.searchbox{padding:14px}.searchbox label{display:block;font-size:12px;color:var(--muted);margin-bottom:7px}.searchbox input{width:100%;font:inherit;background:#091220;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px}.counter{padding:14px;text-align:center}.counter b{display:block;font-size:30px}.counter span{font-size:12px;color:var(--muted)}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}.tab,.btn{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px 13px;cursor:pointer}.tab.active,.btn.primary{background:#1d4ed8;border-color:#3b82f6}.grid{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:16px}.panel{padding:15px}.panel h2{font-size:17px;margin:0 0 12px}.class-list{display:grid;gap:9px}.class-row{width:100%;text-align:left;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:11px;padding:12px;cursor:pointer}.class-row .title{font-weight:700}.meta{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.45}.status{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:999px;padding:4px 8px;margin-top:8px}.status.good{border-color:#166534;color:#86efac}.detail-empty{color:var(--muted);padding:30px 6px;text-align:center}.detail{display:none}.detail.show{display:block}.headline{display:flex;justify-content:space-between;gap:12px;align-items:start;border-bottom:1px solid var(--line);padding-bottom:12px}.headline h3{margin:0;font-size:18px}.small{font-size:12px;color:var(--muted)}.section{margin-top:16px}.section h4{margin:0 0 8px;font-size:14px}.people{border:1px solid var(--line);border-radius:10px;overflow:hidden}.person{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:10px 11px;border-bottom:1px solid var(--line);align-items:center}.person:last-child{border-bottom:0}.person button{font:inherit;color:#bfdbfe;background:transparent;border:0;cursor:pointer;text-align:right}.person-card{display:none;background:#091220;border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px}.person-card.show{display:block}.docs{display:grid;gap:7px}.doc{background:#091220;border:1px solid var(--line);border-radius:9px;padding:10px}.drop{border:2px dashed #475569;border-radius:10px;padding:16px;text-align:center;color:var(--muted);cursor:pointer}.notes{white-space:pre-wrap;background:#091220;border:1px solid var(--line);border-radius:9px;padding:10px;font-size:12px;line-height:1.5}.hidden{display:none!important}.hint{font-size:12px;color:var(--muted);margin-bottom:10px}@media(max-width:900px){.grid{grid-template-columns:1fr}.summary{grid-template-columns:1fr}.counter{text-align:left}.counter b{display:inline;margin-right:7px}.top{position:static}.person{grid-template-columns:1fr}.person button{text-align:left;padding:4px 0}}
</style></head><body><header class="top"><div class="brand"><h1>NHCSO Training</h1><div>Simple class history, paperwork, and AHA eCard visibility</div></div><button class="btn primary" id="newClass">+ New Class</button></header><main class="shell"><section class="summary"><div class="searchbox"><label for="search">Universal search</label><input id="search" placeholder="Search participant, eCard number, instructor, date, class number…"></div><div class="counter"><b>172</b><span>BLS eCards remaining</span></div></section><div class="tabs"><button class="tab active" data-view="recent">Recent / Upcoming</button><button class="tab" data-view="past">Past Classes</button></div><section class="grid"><div class="panel"><h2 id="listTitle">Recent / Upcoming Classes</h2><div class="hint">Search returns the class, even when the match is a participant or eCard number.</div><div class="class-list" id="classList"></div></div><div class="panel"><div id="empty" class="detail-empty">Select a class to see participants, eCards, documents and notes.</div><div id="detail" class="detail"></div></div></section></main><script>
const classes=[{id:'NHSO-20260826-1300-FCFAC7',date:'2026-08-26',time:'1:00 PM',course:'BLS Provider',location:'New Hanover County Sheriff’s Office',lead:'Sgt. Lauren Brothers',assistant:'Crystal Jasper',status:'complete',cards:'11/11 cards issued',docs:['Class Packet.pdf','Assigned eCards_2026-8-28-1635-19-814.xlsx','eCard Reclaim Confirmation.png'],notes:'11 participants completed BLS Provider. Written score 100; practical Pass.\nAHA eCards 271266862666–271266862676 issued. No outstanding requirements.',people:[['Cameron Augst','caugst@nhcgov.com','271266862666'],['Elijah Manriquez','emanriquez@nhcgov.com','271266862667'],['Javier Cruz Garcia','jcruzgarcia@nhcgov.com','271266862668'],['Jeremiah Ross','jeross@nhcgov.com','271266862669'],['Jonathan Handy','jhandy@nhcgov.com','271266862670'],['Justin Tyson','jktyson@nhcgov.com','271266862671'],['Kelly Sellers','ksellers@nhcgov.com','271266862672'],['Khalil Peterson','kpeterson@nhcgov.com','271266862673'],['Matthew Malcolm','mmalcolm@nhcgov.com','271266862674'],['Steven Jessee','sjessee@nhcgov.com','271266862675'],['Taylor Smith-Simons','tsmithsimons@nhcgov.com','271266862676']]},{id:'51327',date:'2026-08-12',time:'1:00 PM',course:'BLS Provider',location:'NHCSO',lead:'Crystal Jasper',assistant:'',status:'complete',cards:'16 students',docs:[],notes:'Historical class.',people:[]},{id:'51162',date:'2026-06-24',time:'1:00 PM',course:'BLS Provider',location:'NHCSO',lead:'V. Carey',assistant:'',status:'complete',cards:'11 students',docs:[],notes:'Historical class.',people:[]},{id:'51155',date:'2026-06-17',time:'1:00 PM',course:'BLS Provider',location:'NHCSO',lead:'Crystal Jasper',assistant:'',status:'complete',cards:'16 students',docs:[],notes:'Historical class.',people:[]},{id:'51125',date:'2026-06-10',time:'1:00 PM',course:'BLS Provider',location:'NHCSO',lead:'Cori Kiefner',assistant:'',status:'complete',cards:'18 students',docs:[],notes:'Historical class.',people:[]}];let currentView='recent';const list=document.getElementById('classList'),detail=document.getElementById('detail'),empty=document.getElementById('empty'),search=document.getElementById('search');function hay(c){return[c.id,c.date,c.time,c.course,c.location,c.lead,c.assistant,c.cards,c.notes,...c.people.flat()].join(' ').toLowerCase()}function fmt(d){const[y,m,day]=d.split('-').map(Number);return new Date(Date.UTC(y,m-1,day)).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric',timeZone:'UTC'})}function render(){const q=search.value.trim().toLowerCase();const filtered=classes.filter(c=>q?hay(c).includes(q):currentView==='past'?c.status==='complete':true);list.innerHTML=filtered.map(c=>`<button class="class-row" data-id="${c.id}"><div class="title">${c.course} · ${fmt(c.date)} · ${c.time}</div><div class="meta">${c.lead}${c.assistant?' + '+c.assistant:''}<br>${c.people.length||c.cards} · ${c.id}</div><span class="status ${c.status==='complete'?'good':''}">${c.status==='complete'?'✓ Complete':'Upcoming'}</span></button>`).join('')||'<div class="detail-empty">No matching classes.</div>';list.querySelectorAll('.class-row').forEach(b=>b.addEventListener('click',()=>openClass(b.dataset.id,q)))}function openClass(id,q=''){const c=classes.find(x=>x.id===id);if(!c)return;empty.classList.add('hidden');detail.classList.add('show');const rows=c.people.length?c.people.map((p,i)=>{const hit=q&&p.join(' ').toLowerCase().includes(q);return`<div class="person"${hit?' style="background:#13233b"':''}><div><strong>${p[0]}</strong><div class="small">${p[1]}</div></div><button data-person="p${i}">${p[2]?'View card':'No card recorded'}</button></div><div class="person-card" id="p${i}"><strong>AHA BLS Provider</strong><div class="small" style="margin-top:5px">eCard: ${p[2]||'Not recorded'}<br>Status: ${p[2]?'Issued · verifier sync can update claimed/verified state':'No card recorded'}<br>Course date: ${fmt(c.date)}</div></div>`}).join(''):'<div class="detail-empty">Historical participant detail not yet imported.</div>';detail.innerHTML=`<div class="headline"><div><h3>${c.course} · ${fmt(c.date)}</h3><div class="small">${c.time} · ${c.location}<br>${c.lead}${c.assistant?' · Assistant: '+c.assistant:''}</div></div><span class="status good">${c.cards}</span></div><div class="section"><h4>Participants</h4><div class="people">${rows}</div></div><div class="section"><h4>Class Documents</h4><div class="drop" id="drop">+ Drop or add a document to this class</div><div class="docs" style="margin-top:8px">${c.docs.map(d=>`<div class="doc">${d}</div>`).join('')||'<div class="small">No documents listed.</div>'}</div></div><div class="section"><h4>Class Notes</h4><div class="notes">${c.notes}</div></div>`;detail.querySelectorAll('[data-person]').forEach(b=>b.addEventListener('click',()=>document.getElementById(b.dataset.person).classList.toggle('show')));document.getElementById('drop').addEventListener('click',()=>alert('Draft behavior: file picker attaches the upload directly to this durable class.'))}search.addEventListener('input',()=>{render();const q=search.value.trim().toLowerCase();if(q){const hit=classes.find(c=>hay(c).includes(q));if(hit)openClass(hit.id,q)}});document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentView=b.dataset.view;document.getElementById('listTitle').textContent=currentView==='past'?'Past Classes':'Recent / Upcoming Classes';render()}));document.getElementById('newClass').addEventListener('click',()=>alert('Draft: New Class stays intentionally short — BLS Provider, date/time, location, lead/assistant instructor and roster.'));render();
</script></body></html>
