<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="canonical" href="https://www.910cpr.com/schedule/">
<title>Choose Your 910CPR Class</title>
<link rel="stylesheet" href="/assets/site-theme.css?v=20260818.5">
<script src="/assets/site-theme.js"></script>
<style>
:root{--navy:#102d46;--blue:#176f9d;--green:#16734d;--red:#b52f36;--ink:#172638;--muted:#637182;--line:#d6e1e8;--soft:#eff5f7}*{box-sizing:border-box}body{margin:0;background:var(--soft);color:var(--ink);font:16px/1.5 Inter,Arial,sans-serif}.top{height:8px;background:linear-gradient(90deg,#d43e45,#ef8a45,#1681ad)}main{max-width:820px;margin:auto;padding:26px 14px 52px}.brand{display:flex;align-items:center;gap:11px;margin-bottom:16px;font-size:21px;font-weight:900}.brand img{width:50px;height:50px;object-fit:contain}.brand small{display:block;color:var(--muted);font-size:12px}.shell{overflow:hidden;border:1px solid var(--line);border-radius:19px;background:#fff;box-shadow:0 16px 42px rgba(15,45,70,.09)}.hero{padding:27px;background:var(--navy);color:#fff}.eyebrow{font-size:12px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;opacity:.8}.hero h1{margin:4px 0 8px;font-size:clamp(28px,7vw,42px);line-height:1.08}.course{font-size:19px;font-weight:800}.content{padding:26px}.notice{margin:0 0 19px;padding:15px 16px;border:1px solid #b9ddcb;border-radius:12px;background:#effaf4;color:#17583d}.explanation{color:var(--muted);margin:0 0 20px}.section-title{margin:24px 0 3px;font-size:23px}.section-intro{margin:0 0 15px;color:var(--muted)}form{display:grid;gap:12px}.choice{display:grid;grid-template-columns:auto 1fr;gap:13px;padding:16px;border:2px solid var(--line);border-radius:13px;cursor:pointer}.choice:has(input:checked){border-color:var(--blue);background:#f0f8fc}.choice input{width:20px;height:20px;margin-top:3px}.choice strong,.choice span{display:block}.choice span{color:var(--muted);font-size:14px}.badge{display:inline-block!important;width:max-content;margin-top:7px;padding:3px 8px;border-radius:999px;background:#e6f0f5;color:var(--navy)!important;font-size:11px!important;font-weight:900;text-transform:uppercase}button{margin-top:5px;border:0;border-radius:11px;padding:15px 18px;background:var(--green);color:#fff;font:800 16px/1.2 inherit;cursor:pointer}button:disabled{opacity:.62;cursor:wait}.status{margin:3px 0 0;color:var(--red)}.status.ok{padding:15px;border-radius:11px;background:#effaf4;color:#17583d}.empty,.error,.loading{padding:42px 26px;text-align:center}.error h1,.empty h2{margin-top:0}.help{display:inline-block;margin-top:12px;color:var(--blue);font-weight:800}.privacy{margin:20px 2px 0;color:var(--muted);font-size:12px}@media(max-width:560px){main{padding-top:16px}.hero,.content{padding:21px}.choice{padding:14px}}
</style>
</head>
<body>
<div class="top"></div>
<main>
  <div class="brand"><img src="/images/logo.png" alt="910CPR"><div>910CPR<small>Coastal CPR Training</small></div></div>
  <section class="shell" id="app"><div class="loading">Checking your private scheduling link…</div></section>
  <p class="privacy">This private page checks current class availability each time it opens. It does not place personal information in the link.</p>
</main>
<script>
const API='https://wktwgcnwdvbebcobgyey.supabase.co/functions/v1/scheduling-gateway';
const app=document.getElementById('app'),params=new URLSearchParams(location.search);
const pathMatch=location.pathname.match(/^\/schedule\/([A-Za-z0-9_-]{43,128})\/?$/);
const queryToken=params.get('token')||'';
if(pathMatch)sessionStorage.setItem('landerwareScheduleToken',pathMatch[1]);
if(queryToken)sessionStorage.setItem('landerwareScheduleToken',queryToken);
const token=pathMatch?.[1]||queryToken||sessionStorage.getItem('landerwareScheduleToken')||'';
if(queryToken)history.replaceState(null,'','/schedule/');
const dateTime=(value,end)=>{const start=new Date(value),finish=end?new Date(end):null,zone={timeZone:'America/New_York'};return{date:new Intl.DateTimeFormat('en-US',{...zone,weekday:'long',month:'long',day:'numeric',year:'numeric'}).format(start),time:new Intl.DateTimeFormat('en-US',{...zone,hour:'numeric',minute:'2-digit'}).format(start)+(finish?' to '+new Intl.DateTimeFormat('en-US',{...zone,hour:'numeric',minute:'2-digit'}).format(finish):'')}};
function text(tag,value,className){const node=document.createElement(tag);if(className)node.className=className;node.textContent=value;return node}
function errorState(message){app.replaceChildren();const box=text('div','', 'error'),heading=text('h1','This scheduling link is unavailable'),detail=text('p',message),help=text('a','Contact 910CPR for help','help');help.href='tel:+19103955193';box.append(heading,detail,help);app.append(box)}
function render(data){app.replaceChildren();const hero=text('div','', 'hero'),eyebrow=text('div','Private scheduling link','eyebrow'),heading=text('h1',data.heading),course=text('div',data.course,'course');hero.append(eyebrow,heading,course);if(data.organization)hero.append(text('div',data.organization));const content=text('div','', 'content'),notice=text('p',data.payment.message,'notice');content.append(notice);if(data.explanation)content.append(text('p',data.explanation,'explanation'));if(!data.sessions.length){const empty=text('div','', 'empty');empty.append(text('h2','No compatible dates are open right now'),text('p','Your link is still valid. Please call or email 910CPR and we will help arrange the right class.'));const help=text('a','Call 910-395-5193','help');help.href='tel:+19103955193';empty.append(help);content.append(empty);app.append(hero,content);return}content.append(text('h2','Available dates','section-title'),text('p','Choose the date that works best. These options are checked against the live schedule.','section-intro'));const form=document.createElement('form');form.id='selection';data.sessions.forEach((session,index)=>{const when=dateTime(session.startsAt,session.endsAt),label=text('label','', 'choice'),radio=document.createElement('input'),copy=document.createElement('span');radio.type='radio';radio.name='session';radio.value=session.id;radio.required=true;if(index===0)radio.checked=true;copy.append(text('strong',`${when.date} • ${when.time}`),text('span',session.location||'Location will be confirmed'));if(session.course!==data.course)copy.append(text('span',session.course));if(session.deliveryMode)copy.append(text('span',session.deliveryMode==='BL'?'Blended / skills session':session.deliveryMode==='IP'?'Instructor-led, in person':session.deliveryMode,'badge'));label.append(radio,copy);form.append(label)});const submit=text('button',data.payment.policy==='self_pay'?'Choose date and continue':'Confirm this class');submit.type='submit';const status=text('p','', 'status');status.id='status';status.role='status';status.setAttribute('aria-live','polite');form.append(submit,status);content.append(form);app.append(hero,content);let idempotency=sessionStorage.getItem('landerwareScheduleActionKey')||crypto.randomUUID();sessionStorage.setItem('landerwareScheduleActionKey',idempotency);form.addEventListener('submit',async event=>{event.preventDefault();if(!form.reportValidity())return;submit.disabled=true;status.className='status';status.textContent='Checking the date and saving your selection…';try{const selected=new FormData(form).get('session'),response=await fetch(`${API}/select/${encodeURIComponent(token)}`,{method:'POST',headers:{'content-type':'application/json','idempotency-key':idempotency},body:JSON.stringify({sessionId:selected})}),payload=await response.json();if(!response.ok||!payload.ok)throw Error(payload.error||'selection_failed');sessionStorage.removeItem('landerwareScheduleActionKey');status.className='status ok';status.textContent=payload.confirmation;if(payload.checkoutUrl)setTimeout(()=>location.assign(payload.checkoutUrl),700);else{form.querySelectorAll('input,button').forEach(control=>control.disabled=true)}}catch(error){const messages={session_not_available:'That date just became unavailable. Refresh this page to see the current choices.',scheduling_token_completed:'This link has already been used.',scheduling_token_expired:'This link has expired.'};status.textContent=messages[error.message]||'We could not save the selection. Please try again or call 910-395-5193.';submit.disabled=false}})}
async function load(){if(!/^[A-Za-z0-9_-]{43,128}$/.test(token)){errorState('Please use the complete private link from your email.');return}try{const response=await fetch(`${API}/context/${encodeURIComponent(token)}`,{cache:'no-store'}),payload=await response.json();if(!response.ok||!payload.ok)throw Error(payload.error||'link_unavailable');render(payload)}catch(error){const messages={scheduling_token_expired:'This link has expired. We can send you a new one.',scheduling_token_revoked:'This link was replaced or cancelled.',scheduling_token_completed:'This link has already been used.',invalid_scheduling_token:'This link is not valid.'};errorState(messages[error.message]||'We could not check this link right now. Please try again or call 910-395-5193.')}}
load();
</script>
</body>
</html>
