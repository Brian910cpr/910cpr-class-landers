<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="referrer" content="no-referrer">
  <title>Restricted Training Portal</title>
  <style>
    :root{color-scheme:dark;--bg:#08101d;--panel:#111827;--line:#334155;--text:#f8fafc;--muted:#a8b4c7}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;padding:24px}
    main{width:min(620px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px}
    h1{margin:0 0 12px;font-size:26px}
    p{margin:0;color:var(--muted);line-height:1.55}
    .status{display:inline-block;margin-bottom:16px;border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px;color:var(--muted)}
  </style>
<link rel="stylesheet" href="/assets/site-theme.css?v=20260818.5">
<script src="/assets/site-theme.js"></script>
</head>
<body>
  <main>
    <div class="status">Restricted access</div>
    <h1>Training records are not available on the public web.</h1>
    <p>This workspace is limited to authorized users. No roster, participant, class-history, document, or credential data is served from this public page.</p>
  </main>
</body>
</html>
