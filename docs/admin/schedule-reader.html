  <style>
    :root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}main{max-width:1100px;margin:auto;padding:20px}h1{margin:.15em 0;font-size:clamp(1.65rem,5vw,2.5rem)}.note{color:#536078}.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}.button,button{border:0;border-radius:8px;background:#075ea8;color:#fff;padding:11px 15px;font-weight:700;cursor:pointer;text-decoration:none;font-size:14px}.secondary{background:#e5ebf3;color:#172033}.file{position:relative;overflow:hidden}.file input{position:absolute;inset:0;opacity:0;cursor:pointer}.status{padding:12px 14px;border-left:5px solid #075ea8;background:#fff;border-radius:6px;margin:14px 0}.status.error{border-color:#b42318;color:#8b1a12}.meta{font-size:.9rem;color:#536078}.day{margin:22px 0 10px;padding:9px 12px;background:#172033;color:#fff;border-radius:7px;font-size:1.05rem}.today{background:#8b1a12}.cards{display:grid;gap:10px}.card{display:grid;grid-template-columns:170px 1.4fr 1fr 90px;gap:12px;align-items:start;background:#fff;padding:15px;border-radius:9px;box-shadow:0 1px 3px #0002}.time{font-size:1.05rem;font-weight:800}.course{font-weight:750}.label{display:block;color:#667085;font-size:.73rem;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}.register{color:#075ea8;font-weight:700}.empty{padding:28px;background:#fff;border-radius:9px}footer{margin:28px 0;color:#667085;font-size:.85rem}@media(max-width:760px){main{padding:14px}.card{grid-template-columns:1fr 1fr}.course{grid-column:1/-1}.where{grid-column:1/-1}}@media(max-width:430px){.card{grid-template-columns:1fr}.course,.where{grid-column:auto}}

<main>
  <h1>Emergency Schedule Reader</h1>
  <p class="note">Independent of the Operations dashboard. This page reads the schedule JSON directly.</p>
  <div class="toolbar">
    <button id="reload" type="button">Reload live schedule</button>
    <a class="button secondary" id="raw" href="/data/admin_schedule.json" target="_blank" rel="noopener">Open raw JSON</a>
    <button class="button secondary file" type="button">Open downloaded JSON<input id="file" type="file" accept="application/json,.json" aria-label="Open downloaded schedule JSON"></button>
    <button class="secondary" id="download" type="button" disabled>Download current JSON</button>
  </div>
  <div id="status" class="status" role="status">Loading live schedule…</div>
  <div id="schedule"></div>
  <footer>Tip: bookmark this page. If the live file is unavailable, use “Open downloaded JSON” to read a saved copy on any device.</footer>
</main>
<script>
(() => {
  const LIVE_URL = location.protocol === 'file:'
    ? 'https://www.910cpr.com/data/admin_schedule.json'
    : '/data/admin_schedule.json';
  const schedule = document.getElementById('schedule');
  const status = document.getElementById('status');
  const download = document.getElementById('download');
  let currentData = null;

  const esc = value => String(value ?? '').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
  const dateKey = date => new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit'}).format(date);
  const dayText = date => new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',weekday:'long',month:'long',day:'numeric',year:'numeric'}).format(date);
  const timeText = value => new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',hour:'numeric',minute:'2-digit'}).format(new Date(value));

  function render(data, source) {
    if (!data || !Array.isArray(data.sessions)) throw new Error('This file does not contain a sessions array.');
    currentData = data;
    download.disabled = false;
    const sessions = [...data.sessions].sort((a,b) => new Date(a.start_at) - new Date(b.start_at));
    const today = dateKey(new Date());
    status.className = 'status';
    status.innerHTML = `<strong>${sessions.length} sessions loaded</strong><div class="meta">Source: ${esc(source)} · File generated: ${esc(data.generated_at || 'unknown')}</div>`;
    if (!sessions.length) { schedule.innerHTML = '<div class="empty">The schedule file contains no sessions.</div>'; return; }
    let lastDay = '';
    schedule.innerHTML = sessions.map(item => {
      const start = new Date(item.start_at);
      const key = dateKey(start);
      const heading = key !== lastDay ? `<h2 class="day ${key === today ? 'today' : ''}">${esc(dayText(start))}${key === today ? ' — TODAY' : ''}</h2>` : '';
      lastDay = key;
      const end = item.end_at ? `–${timeText(item.end_at)}` : '';
      const link = item.registration_url ? `<a class="register" href="${esc(item.registration_url)}" target="_blank" rel="noopener">Registration ↗</a>` : '—';
      const participants = `<a class="register" href="${esc(LanderWareSession.workspaceUrl(item))}">${esc(LanderWareSession.participantLabel(item))}</a>`;
      return `${heading}<article class="card"><div><span class="label">Time</span><div class="time">${esc(timeText(item.start_at))}${esc(end)}</div></div><div class="course"><span class="label">Course</span>${esc(item.course_name || 'Unnamed class')}</div><div class="where"><span class="label">Location / instructor</span>${esc(item.location_name || 'Unknown')}<br><span class="meta">${esc(item.lead_instructor_name || 'Instructor unassigned')}</span></div><div><span class="label">Roster</span>${participants}<br>${link}</div></article>`;
    }).join('');
  }

  async function loadLive() {
    status.className = 'status'; status.textContent = 'Loading live schedule…'; schedule.innerHTML = '';
    try {
      const response = await fetch(`${LIVE_URL}?v=${Date.now()}`, {cache:'no-store'});
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const data=await response.json();try{await LanderWareSession.hydrate(data.sessions||[])}catch{}render(data, 'live admin_schedule.json');
    } catch (error) {
      status.className = 'status error';
      status.textContent = `Live schedule could not be loaded: ${error.message}. Open a downloaded JSON file above.`;
    }
  }

  document.getElementById('reload').addEventListener('click', loadLive);
  document.getElementById('file').addEventListener('change', async event => {
    const file = event.target.files[0]; if (!file) return;
    try { render(JSON.parse(await file.text()), file.name); }
    catch (error) { status.className = 'status error'; status.textContent = `Could not read ${file.name}: ${error.message}`; }
  });
  download.addEventListener('click', () => {
    if (!currentData) return;
    const url = URL.createObjectURL(new Blob([JSON.stringify(currentData,null,2)],{type:'application/json'}));
    const link = Object.assign(document.createElement('a'),{href:url,download:'admin_schedule.json'}); link.click(); URL.revokeObjectURL(url);
  });
  document.getElementById('raw').href = LIVE_URL;
  loadLive();
})();
</script>
</body>
