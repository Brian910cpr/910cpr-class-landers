<!doctype html>
<html lang="en">
<head>

<link rel="stylesheet" href="/assets/css/global.css">
<link rel="stylesheet" href="/assets/site-theme.css?v=20260818.5">
<style>
:root{--time-w:84px;--cell-w:38px;--header-h:172px}*{box-sizing:border-box}body{margin:0;background:#f5f7f9;color:#17212b;font:14px/1.35 system-ui,-apple-system,Segoe UI,sans-serif}.shell{padding:16px 18px 28px}.head{display:flex;gap:18px;align-items:end;justify-content:space-between;flex-wrap:wrap;margin:12px 0}.head h1{margin:0;font-size:28px}.head p{margin:4px 0 0;color:#56616d}.controls{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.controls label{display:grid;gap:4px;font-size:12px;font-weight:700;color:#56616d}.controls input,.controls select,.controls button{height:38px;border:1px solid #c7d0d8;border-radius:8px;background:#fff;padding:0 10px}.legend{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 14px;font-size:12px}.legend span{display:flex;gap:5px;align-items:center}.sw{width:18px;height:14px;border:1px solid #aab4bd;border-radius:3px}.sw.offered{background:#7fc7a4}.sw.seated{background:#176b4d;border:2px solid #0c4330}.sw.joinable{background:repeating-linear-gradient(135deg,#7fc7a4 0 5px,#e9f7f0 5px 10px)}.sw.suppressed{background:#edf0f2}.status{font-size:12px;color:#56616d;margin-left:auto}.matrix-wrap{height:72vh;overflow:auto;border:1px solid #c7d0d8;border-radius:10px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.06)}table{border-collapse:separate;border-spacing:0;min-width:max-content}th,td{border-right:1px solid #dfe5ea;border-bottom:1px solid #e7ebee}thead th{position:sticky;top:0;z-index:4;background:#fff;height:var(--header-h);vertical-align:bottom}.time-head{left:0;z-index:6!important;width:var(--time-w);min-width:var(--time-w);padding:8px}.course-head{width:var(--cell-w);min-width:var(--cell-w);padding:0}.course-head>div{height:160px;display:flex;align-items:flex-end;justify-content:center;writing-mode:vertical-rl;transform:rotate(180deg);padding:8px 4px;font-size:11px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.course-head small{font-weight:500;color:#6b7680}.time{position:sticky;left:0;z-index:3;background:#fff;width:var(--time-w);min-width:var(--time-w);padding:4px 8px;text-align:right;font-variant-numeric:tabular-nums;font-size:12px;font-weight:700}.hour .time,.hour td{border-top:2px solid #aeb8c1}.cell{width:var(--cell-w);min-width:var(--cell-w);height:22px;padding:0;cursor:pointer;background:#edf0f2;position:relative}.cell:hover{outline:2px solid #111;outline-offset:-2px;z-index:2}.cell.offered{background:#7fc7a4}.cell.seated{background:#176b4d;box-shadow:inset 0 0 0 2px #0c4330}.cell.joinable{background:repeating-linear-gradient(135deg,#7fc7a4 0 5px,#e9f7f0 5px 10px)}.cell.suppressed{background:#edf0f2}.cell.none{background:#fafbfc}.cell.has-reasons:after{content:'';position:absolute;right:2px;bottom:2px;width:4px;height:4px;border-radius:50%;background:rgba(0,0,0,.45)}.family-BLS.offered,.family-BLS.joinable{background-color:#80b7e8}.family-BLS.seated{background:#245f91}.family-Heartsaver.offered,.family-Heartsaver.joinable{background-color:#eeb36d}.family-Heartsaver.seated{background:#985910}.family-ACLS.offered,.family-ACLS.joinable{background-color:#d99ae3}.family-ACLS.seated{background:#774180}.family-PALS.offered,.family-PALS.joinable{background-color:#ef8e96}.family-PALS.seated{background:#8f3038}.family-ARC.offered,.family-ARC.joinable{background-color:#9ad3d0}.family-ARC.seated{background:#2d7470}.family-HSI.offered,.family-HSI.joinable{background-color:#b7cc8c}.family-HSI.seated{background:#607a2f}.drawer{position:fixed;inset:0 0 0 auto;width:min(460px,95vw);background:#fff;border-left:1px solid #bbc4cc;box-shadow:-8px 0 24px rgba(0,0,0,.16);z-index:20;padding:18px;overflow:auto;transform:translateX(102%);transition:.18s ease}.drawer.open{transform:none}.drawer button{float:right}.drawer h2{margin:0 50px 4px 0}.meta{display:grid;grid-template-columns:120px 1fr;gap:6px 10px;margin:18px 0}.meta dt{font-weight:700;color:#5b6570}.meta dd{margin:0;overflow-wrap:anywhere}.reasons{margin:8px 0 0;padding-left:20px}.error{padding:14px;border:1px solid #d9a4a4;background:#fff0f0;border-radius:8px;color:#7d2323}@media(max-width:700px){.shell{padding:10px}.matrix-wrap{height:70vh}:root{--cell-w:34px;--header-h:150px}.course-head>div{height:140px}}
</style>
<style>
:root{--lane-w:58px}.lane-head,.lane-cell{width:var(--lane-w);min-width:var(--lane-w)}.lane-head{padding:0;background:#f0f4f7!important}.lane-head>div{height:160px;display:flex;align-items:flex-end;justify-content:center;writing-mode:vertical-rl;transform:rotate(180deg);padding:8px 6px;font-size:11px;font-weight:800}.lane-cell{cursor:pointer;position:relative;background:#fafbfc}.lane-cell.unavailable{background:#303b46}.lane-cell.enrollware-ical{background:#5b8def}.lane-cell.class-report{background:#b078d1}.lane-cell.enrollware-other{background:#d59848}.lane-divider{border-right:3px solid #8996a3!important}
</style>
<script src="/assets/site-theme.js"></script>
</head>
<body>
<div id="adminNav"></div>
<div class="shell">
  <div class="head">
    <div><h1>Scheduling Landscape</h1><p>15-minute all-course view of what the scheduler is offering, seating, joining, or suppressing.</p></div>
    <div class="controls">
      <label>Date<input id="datePick" type="date"></label>
      <label>Family<select id="familyPick"><option value="">All course families</option></select></label>
      <button id="todayBtn" type="button">Today</button>
      <span class="status" id="status">Loading…</span>
    </div>
  </div>
  <div class="legend"><span><i class="sw offered"></i> Offered</span><span><i class="sw seated"></i> Seated / real class</span><span><i class="sw joinable"></i> Joinable</span><span><i class="sw suppressed"></i> Suppressed</span><span>Click any cell for the rule trace.</span></div>
  <div class="legend"><span><i class="sw" style="background:#5b8def"></i> Enrollware iCal</span><span><i class="sw" style="background:#b078d1"></i> Class Report</span><span><i class="sw" style="background:#d59848"></i> Other Enrollware</span><span><i class="sw" style="background:#303b46"></i> Brian unavailable</span></div>
  <div id="error"></div>
  <div class="matrix-wrap" id="wrap"><table id="matrix"></table></div>
</div>
<aside class="drawer" id="drawer" aria-hidden="true"><button id="closeDrawer" type="button">Close</button><h2 id="drawerTitle">Decision trace</h2><div id="drawerBody"></div></aside>
<script src="/admin/admin-nav.js?v=20260822-2"></script>
<script>
(()=>{const DATA='/data/admin/scheduling_landscape.json';const $=id=>document.getElementById(id);let model=null;const datePick=$('datePick'),familyPick=$('familyPick'),matrix=$('matrix'),status=$('status'),drawer=$('drawer');
const fmt=t=>{const [h,m]=t.split(':').map(Number);const ap=h>=12?'PM':'AM';return `${((h+11)%12)+1}:${String(m).padStart(2,'0')} ${ap}`};
const times=()=>{const out=[];let m=8*60;while(m<19*60){out.push(`${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`);m+=15}return out};
const key=(d,t,c)=>`${d}|${t}|${c}`;const famClass=f=>'family-'+String(f||'Other').replace(/[^A-Za-z0-9_-]/g,'');
function show(cell,course,time){const reasons=Array.isArray(cell?.reasons)?cell.reasons:[];const title=course.courseName||course.courseId;const result=cell?.result||'no candidate';$('drawerTitle').textContent=`${fmt(time)} · ${title}`;$('drawerBody').innerHTML=`<dl class="meta"><dt>Date</dt><dd>${datePick.value}</dd><dt>Course</dt><dd>${title}</dd><dt>Course ID</dt><dd>${course.courseId}</dd><dt>Family</dt><dd>${course.courseFamily||''}</dd><dt>Decision</dt><dd><b>${result}</b></dd><dt>Instructor</dt><dd>${cell?.instructor||'—'}</dd><dt>Location</dt><dd>${cell?.location||'—'}</dd><dt>Source block</dt><dd>${cell?.availabilityBlockId||'—'}</dd><dt>Offer type</dt><dd>${cell?.offerType||'—'}</dd></dl><h3>Rule / reason trace</h3>${reasons.length?`<ul class="reasons">${reasons.map(r=>`<li>${String(r).replace(/[<>&]/g,s=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[s]))}</li>`).join('')}</ul>`:'<p>No detailed rejection reason was published for this intersection.</p>'}${cell?.registrationUrl?`<p><a href="${cell.registrationUrl}" target="_blank" rel="noopener">Open registration target</a></p>`:''}`;drawer.classList.add('open');drawer.setAttribute('aria-hidden','false')}
function render(){if(!model)return;const d=datePick.value;const family=familyPick.value;const courses=model.courses.filter(c=>!family||c.courseFamily===family);const idx=new Map(model.cells.filter(c=>c.date===d).map(c=>[key(c.date,c.startTime,c.courseId),c]));let html='<thead><tr><th class="time-head">Time</th>'+courses.map(c=>`<th class="course-head"><div title="${c.courseName}">${c.courseName}<small>${c.courseId}</small></div></th>`).join('')+'</tr></thead><tbody>';for(const t of times()){html+=`<tr class="${t.endsWith(':00')?'hour':''}"><th class="time">${fmt(t)}</th>`;for(const c of courses){const cell=idx.get(key(d,t,c.courseId));const result=cell?.result||'none';html+=`<td class="cell ${result} ${famClass(c.courseFamily)} ${cell?.reasons?.length?'has-reasons':''}" data-time="${t}" data-course="${c.courseId}" title="${c.courseName}: ${result}"></td>`}html+='</tr>'}html+='</tbody>';matrix.innerHTML=html;matrix.querySelectorAll('.cell').forEach(td=>td.addEventListener('click',()=>{const c=courses.find(x=>x.courseId===td.dataset.course);show(idx.get(key(d,td.dataset.time,td.dataset.course)),c,td.dataset.time)}));status.textContent=`${courses.length} courses · ${idx.size} evaluated cells · feed ${model.generatedAt||'unknown time'}`}
async function init(){try{const r=await fetch(DATA,{cache:'no-store'});if(!r.ok)throw new Error(`Feed returned ${r.status}`);model=await r.json();const families=[...new Set(model.courses.map(c=>c.courseFamily).filter(Boolean))].sort();familyPick.insertAdjacentHTML('beforeend',families.map(f=>`<option>${f}</option>`).join(''));const today=new Date().toLocaleDateString('en-CA');datePick.min=model.window?.startDate||'';datePick.max=model.window?.endDate||'';datePick.value=(today>=datePick.min&&today<=datePick.max)?today:(model.window?.startDate||today);datePick.addEventListener('change',render);familyPick.addEventListener('change',render);$('todayBtn').addEventListener('click',()=>{datePick.value=today;render()});render()}catch(err){$('error').innerHTML=`<div class="error"><b>Scheduling Landscape feed is not available.</b><br>${err.message}</div>`;status.textContent='Load failed'}}
$('closeDrawer').addEventListener('click',()=>{drawer.classList.remove('open');drawer.setAttribute('aria-hidden','true')});init()})();
</script>
<script src="/admin/scheduling-landscape-lanes.js?v=20260825-1"></script>
</body></html>
