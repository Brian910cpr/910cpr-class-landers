[functions.registration-reschedule]
# The handler validates an expiring private capability, or an existing owner session.
verify_jwt = false

[functions.skills-session-reservation]
# New anonymous bookings use a server-fetched leased offer, service-only atomic
# claim, explicit canonical context configuration, and a default-off activation gate.
verify_jwt = true

[functions.public-registration]
# Public availability/registration uses server-fetched inventory. Order recovery
# and document operations require an opaque owned receipt, not a client JWT.
verify_jwt = false


[functions.native-checkout-confirmations]
# Every status/retry request is checked by the existing private owner-session or
# owner-automation authorizer before service-only queue access. No public sender.
verify_jwt = false

